<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendDetective</title>
    <link rel="stylesheet" href="/static/map-widget/map-widget.css">
    <link rel="stylesheet" href="/static/plots/plots.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            background-color: #f1f5f9;
            color: #0f172a;
        }

        /* Left Sidebar */
        .sidebar {
            width: 340px;
            flex-shrink: 0;
            background-color: #ffffff;
            border-right: 1px solid #e2e8f0;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 2px 0 12px rgba(15, 23, 42, 0.04);
        }

        /* Top-left Apply button row */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        button.py-button {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 0.6rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
        }
        button.py-button:hover:not(:disabled) {
            background-color: #1d4ed8;
        }
        button.py-button:active:not(:disabled) {
            transform: scale(0.98);
        }
        button.py-button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Form field groups (Timeintervall & Interval length) */
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .field-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #475569;
        }
        .timeintervall-row,
        .interval-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .timeintervall-separator {
            font-weight: 600;
            color: #64748b;
            user-select: none;
        }
        .text-input,
        .select-input {
            width: 100%;
            padding: 0.55rem 0.75rem;
            font-size: 0.9rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            background-color: #ffffff;
            color: #0f172a;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .text-input::placeholder {
            color: #94a3b8;
            opacity: 1;
        }
        .text-input:focus,
        .select-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .text-input.invalid {
            border-color: #dc2626;
        }
        .field-hint {
            font-size: 0.76rem;
            color: #dc2626;
            display: none;
        }
        .field-hint.visible {
            display: block;
        }

        /* Upper search bar */
        .search-wrapper {
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 0.6rem 0.85rem;
            font-size: 0.92rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .search-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Dropdown menus for Topics and Tools */
        .dropdown {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background-color: #ffffff;
            overflow: hidden;
        }
        .dropdown-toggle {
            width: 100%;
            background-color: #f8fafc;
            border: none;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            text-align: left;
        }
        .dropdown-toggle:hover {
            background-color: #f1f5f9;
        }
        .dropdown-arrow {
            font-size: 0.8rem;
            color: #64748b;
            transition: transform 0.2s ease;
        }
        .dropdown.open .dropdown-arrow {
            transform: rotate(180deg);
        }
        .dropdown-menu {
            display: none;
            border-top: 1px solid #e2e8f0;
            max-height: 260px;
            overflow-y: auto;
            padding: 0.4rem 0;
        }
        .dropdown.open .dropdown-menu {
            display: block;
        }

        /* Items with checkbox on the left */
        .topic-item {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            user-select: none;
            font-size: 0.92rem;
            transition: background-color 0.1s ease;
        }
        .topic-item:hover {
            background-color: #f8fafc;
        }
        .topic-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2563eb;
            cursor: pointer;
            margin: 0;
        }
        .empty-message {
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            color: #64748b;
            font-style: italic;
        }

        /* Main Visualization Workspace */
        .main-content {
            flex: 1;
            min-width: 0;
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        .map-box {
            position: relative;
            flex: 1;
            min-height: 420px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
        }
        .map-box #map-widget {
            position: absolute;
            inset: 0;
        }
        .status-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 1rem 1.25rem;
        }
        .status-card h3 {
            margin: 0 0 0.75rem 0;
            font-size: 0.95rem;
            color: #334155;
        }
        .viz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
        }
        .topic-viz-card {
            min-width: 0;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.85rem 1rem;
            background: #f8fafc;
        }
        .topic-viz-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.92rem;
        }
        .badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 0.6rem;
        }
        .topic-error {
            font-size: 0.8rem;
            color: #991b1b;
            background: #fee2e2;
            border-radius: 6px;
            padding: 4px 8px;
            margin: 6px 0;
        }
        .coverage-box {
            font-size: 0.8rem;
            color: #334155;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 6px 8px;
            margin: 6px 0;
        }
        .coverage-box.coverage-muted { color: #64748b; }
        .coverage-title { font-weight: 600; margin-bottom: 4px; }
        .coverage-code { margin-top: 6px; }
        .coverage-code-head { display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; }
        .coverage-code-head .muted { color: #64748b; }
        .coverage-bars { display: block; width: 100%; height: 34px; margin-top: 3px; }
        .coverage-bars rect.bar { fill: #0f766e; }
        .coverage-bars rect.bar:hover { fill: #134e4a; }
        .coverage-bars rect.request { fill: #fed7aa; }
        .coverage-bars line.need { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 3 2; vector-effect: non-scaling-stroke; }
        .coverage-axis { display: flex; justify-content: space-between; color: #64748b; font-size: 0.72rem; }
        .coverage-legend { color: #64748b; font-size: 0.72rem; margin-top: 2px; }
        .coverage-legend .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: -1px; margin-right: 3px; }
        .coverage-stations { margin: 4px 0 0; padding-left: 16px; color: #475569; }
        .coverage-use {
            margin-top: 4px;
            font: inherit;
            font-size: 0.78rem;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid #0f766e;
            background: #fff;
            color: #0f766e;
            cursor: pointer;
        }
        .coverage-use:hover { background: #0f766e; color: #fff; }
        .station-line {
            font-size: 0.8rem;
            color: #5b21b6;
            background: #ede9fe;
            border-radius: 6px;
            padding: 4px 8px;
            margin: 6px 0;
        }

        .metric-badge {
            font-size: 0.78rem;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            background: #e0e7ff;
            color: #1e40af;
            font-weight: 500;
        }
        .metric-badge-muted {
            background: #f1f5f9;
            color: #64748b;
            font-weight: 400;
        }
        .chart-host {
            min-width: 0;
        }
        .chart-svg {
            max-width: 100%;
            height: auto;
            background: #ffffff;
            box-shadow: 0 0 0 1px #e2e8f0;
            border-radius: 6px;
            display: block;
        }
        .chart-svg text {
            font-family: inherit;
            font-size: 11px;
            fill: #64748b;
        }
        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            font-size: 0.75rem;
            color: #475569;
            margin-top: 4px;
        }
        .chart-empty {
            font-size: 0.8rem;
            color: #64748b;
            padding: 16px;
            text-align: center;
            border: 1px dashed #cbd5e1;
            border-radius: 6px;
        }
        /* City / region search on the map */
        .place-search {
            position: absolute;
            top: 10px;
            right: 52px;
            width: min(300px, calc(100% - 120px));
            z-index: 5;
            font-size: 0.85rem;
        }
        .place-search input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.5rem 2rem 0.5rem 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.18);
            font: inherit;
            color: #1f2933;
        }
        .place-search input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }
        .place-search-status {
            position: absolute;
            right: 0.6rem;
            top: 0.5rem;
            color: #94a3b8;
            pointer-events: none;
        }
        .place-results {
            list-style: none;
            margin: 4px 0 0;
            padding: 4px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.2);
            max-height: 300px;
            overflow-y: auto;
        }
        .place-results[hidden] { display: none; }
        .place-results li {
            padding: 0.45rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            line-height: 1.3;
        }
        .place-results li[aria-selected="true"],
        .place-results li:hover { background: #eff6ff; }
        .place-results .place-name { font-weight: 600; color: #1e293b; }
        .place-results .place-kind {
            margin-left: 0.4rem;
            font-size: 0.72rem;
            color: #64748b;
            text-transform: capitalize;
        }
        .place-results .place-label {
            display: block;
            font-size: 0.75rem;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .place-results .place-empty { cursor: default; color: #64748b; }
        .place-results .place-empty:hover { background: none; }
    </style>
</head>
<body>
    <!-- Left Sidebar -->
    <aside class="sidebar">
        <!-- Top-left Apply button (disabled until >=1 topic, valid DD.MM.YYYY timeintervall, and interval > 0) -->
        <div class="top-bar">
            <button id="apply" class="py-button" type="button" disabled>Apply</button>
        </div>

        <!-- Timeintervall brackets [DD.MM.YYYY] - [DD.MM.YYYY] above the search bar -->
        <div class="field-group">
            <span class="field-label">Timeintervall</span>
            <div class="timeintervall-row">
                <input
                    id="timeintervall-start"
                    class="text-input"
                    type="text"
                    maxlength="10"
                    placeholder="DD.MM.YYYY"
                    aria-label="Start date (DD.MM.YYYY)"
                >
                <span class="timeintervall-separator">-</span>
                <input
                    id="timeintervall-end"
                    class="text-input"
                    type="text"
                    maxlength="10"
                    placeholder="DD.MM.YYYY"
                    aria-label="End date (DD.MM.YYYY)"
                >
            </div>
            <span id="timeintervall-hint" class="field-hint">Dates must be valid and written as DD.MM.YYYY (end &ge; start).</span>
        </div>

        <!-- Two-part Interval length: float (> 0) and unit (Day, Month, Year) -->
        <div class="field-group">
            <label class="field-label" for="interval-value">Interval Length</label>
            <div class="interval-row">
                <input
                    id="interval-value"
                    class="text-input"
                    type="number"
                    step="any"
                    min="0"
                    placeholder="Value (> 0)"
                    aria-label="Interval length value"
                >
                <select id="interval-unit" class="select-input" aria-label="Interval length unit">
                    <option value="Day">Day</option>
                    <option value="Month">Month</option>
                    <option value="Year">Year</option>
                </select>
            </div>
            <span id="interval-hint" class="field-hint">Value must be a number greater than 0.</span>
        </div>

        <!-- Upper search bar -->
        <div class="search-wrapper">
            <input
                id="topic-search"
                class="search-input"
                type="search"
                placeholder="Search topics..."
                aria-label="Search topics"
            >
        </div>

        <!-- Topics Dropdown Menu (starts closed) -->
        <div id="topics-dropdown" class="dropdown">
            <button id="dropdown-toggle-btn" class="dropdown-toggle" type="button">
                <span>Topics</span>
                <span class="dropdown-arrow">&#9662;</span>
            </button>
            <div id="topics-list" class="dropdown-menu"></div>
        </div>

    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <div class="map-box" aria-label="TrendDetective World Map">
            <div id="map-widget"></div>
            <div class="place-search" role="search">
                <input id="place-search" type="search" placeholder="Search city, region or lat, lon…"
                    autocomplete="off" aria-label="Search city, region or coordinates"
                    role="combobox" aria-expanded="false" aria-controls="place-results" aria-autocomplete="list">
                <span class="place-search-status" id="place-search-status" aria-hidden="true"></span>
                <ul class="place-results" id="place-results" role="listbox" hidden></ul>
            </div>
        </div>

        <!-- Plot panel: timeline, years overlaid, period across years (static/plots/plots.js) -->
        <section class="status-card" aria-label="Plot of the requested data">
            <div id="plot-panel"></div>
        </section>

        <div class="status-card">
            <h3>Request Visualization &amp; Task Output (<code>src/task.py</code>)</h3>
            <div id="visualization-container" class="viz-grid">
                <div class="empty-message">Select topics, fill the timeintervall, and click "Apply" to run tasks and visualize results.</div>
            </div>
        </div>
    </main>

    <script>
        // City / region search: type a name, pick a result, the map zooms there.
        (function () {
            const input = document.getElementById('place-search');
            const list = document.getElementById('place-results');
            const status = document.getElementById('place-search-status');
            if (!input || !list) return;
            const base = window.location.protocol.startsWith('http') ? '' : 'http://127.0.0.1:8000';
            let results = [];
            let active = -1;
            let timer = null;
            let requestNo = 0;

            const esc = (text) => String(text ?? '').replace(/[&<>"']/g, (c) => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

            function setOpen(open) {
                list.hidden = !open;
                input.setAttribute('aria-expanded', String(open));
            }

            function render(message) {
                if (message) {
                    list.innerHTML = `<li class="place-empty">${esc(message)}</li>`;
                } else {
                    list.innerHTML = results.map((p, i) => `
                        <li role="option" id="place-opt-${i}" data-i="${i}" aria-selected="${i === active}">
                            <span class="place-name">${esc(p.name)}</span><span class="place-kind">${esc(p.kind)}</span>
                            <span class="place-label">${esc(p.label)}</span>
                        </li>`).join('');
                }
                input.setAttribute('aria-activedescendant', active >= 0 ? `place-opt-${active}` : '');
                setOpen(true);
            }

            // Nominatim boxes can include far-away islands (Tokyo reaches 20°N). When the
            // place's centre sits near the edge of its box, zoom to the surroundings instead.
            function viewBox(place) {
                const [w, s, e, n] = place.bbox;
                const width = e - w, height = n - s;
                const fx = width > 0 ? (place.lon - w) / width : 0.5;
                const fy = height > 0 ? (place.lat - s) / height : 0.5;
                const lopsided = fx < 0.15 || fx > 0.85 || fy < 0.15 || fy > 0.85;
                if (lopsided && (width > 2 || height > 2)) {
                    return [place.lon - 0.5, place.lat - 0.35, place.lon + 0.5, place.lat + 0.35];
                }
                if (width < 0.02 && height < 0.02) {
                    return [place.lon - 0.05, place.lat - 0.035, place.lon + 0.05, place.lat + 0.035];
                }
                return [w, s, e, n];
            }

            // Settlements become the evaluation point (their measuring station is found
            // near it). Areas can only be the predefined regions, so for states, counties,
            // countries etc. the map zooms there and shows the regions (Areas).
            const POINT_KINDS = new Set(['city', 'town', 'village', 'hamlet', 'suburb', 'quarter',
                'neighbourhood', 'borough', 'city district', 'municipality', 'locality', 'coordinates']);

            function placeArea(place) {
                const properties = { placeName: place.name, placeLabel: place.label };
                const [w, s, e, n] = viewBox(place);
                if (POINT_KINDS.has(place.kind) || (e - w < 0.2 && n - s < 0.2)) {
                    return { type: 'Feature', properties: { ...properties, shape: 'point' },
                        geometry: { type: 'Point', coordinates: [place.lon, place.lat] } };
                }
                return null;
            }

            function choose(i) {
                const place = results[i];
                if (!place) return;
                input.value = place.name;
                setOpen(false);
                const map = window.trendMap;
                if (!map) return;
                const area = placeArea(place);
                if (area && typeof map.setArea === 'function') map.setArea(area);
                if (!area && typeof map.showRegions === 'function') map.showRegions(true);
                if (typeof map.fitToBounds === 'function') map.fitToBounds(viewBox(place));
            }

            async function search(query) {
                const no = ++requestNo;
                status.textContent = '…';
                try {
                    const res = await fetch(`${base}/api/places?q=${encodeURIComponent(query)}`);
                    const data = await res.json().catch(() => ({}));
                    if (no !== requestNo) return;
                    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
                    results = data.places || [];
                    active = results.length ? 0 : -1;
                    render(results.length ? '' : `No place found for "${query}".`);
                } catch (err) {
                    if (no !== requestNo) return;
                    results = [];
                    active = -1;
                    render(err.message || 'Search failed.');
                } finally {
                    if (no === requestNo) status.textContent = '';
                }
            }

            input.addEventListener('input', () => {
                clearTimeout(timer);
                const query = input.value.trim();
                if (query.length < 2) {
                    requestNo++;
                    results = [];
                    status.textContent = '';
                    setOpen(false);
                    return;
                }
                timer = setTimeout(() => search(query), 450);
            });

            input.addEventListener('keydown', (event) => {
                if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                    if (!results.length) return;
                    event.preventDefault();
                    const step = event.key === 'ArrowDown' ? 1 : -1;
                    active = (active + step + results.length) % results.length;
                    render();
                } else if (event.key === 'Enter') {
                    event.preventDefault();
                    if (!list.hidden && active >= 0) {
                        choose(active);
                    } else if (input.value.trim().length >= 2) {
                        clearTimeout(timer);
                        search(input.value.trim());
                    }
                } else if (event.key === 'Escape') {
                    setOpen(false);
                }
            });

            // mousedown (not click) so the choice lands before the input loses focus
            list.addEventListener('mousedown', (event) => {
                const item = event.target.closest('li[data-i]');
                if (!item) return;
                event.preventDefault();
                choose(Number(item.dataset.i));
            });
            input.addEventListener('focus', () => { if (results.length) render(); });
            input.addEventListener('blur', () => setOpen(false));
        })();
    </script>
    <script src="/static/plots/plots.js"></script>
    <script>
        if (window.TrendPlots) window.TrendPlots.mount(document.getElementById('plot-panel'));
    </script>
    <script type="module" src="/static/map-widget/map-widget.js"></script>
    <script type="module">
        let selectedArea = null;
        if (window.TrendDetectiveMap) {
            window.trendMap = window.TrendDetectiveMap.mount(document.getElementById('map-widget'), {
                onAreaSelected: (area) => {
                    selectedArea = area;
                },
                onAreaCleared: () => {
                    selectedArea = null;
                },
            });
        }
        window.getSelectedArea = () => selectedArea;
        // The regions of the map's Areas button are loaded per selected topic (refreshRegions below).
    </script>

    <script>
        const API_BASE = window.location.protocol.startsWith('http') ? '' : 'http://127.0.0.1:8000';

        let allTopics = [];
        const selectedTopics = {};

        // Regions with enough stations to evaluate an area for the selected topics (the
        // map's Areas button). Reloaded on every topic change; only the newest answer is
        // applied, so a slow reply for an earlier selection cannot overwrite it.
        let regionsRequest = 0;
        function refreshRegions() {
            if (!window.trendMap) return;
            const request = ++regionsRequest;
            const topics = Object.keys(selectedTopics).filter((topic) => selectedTopics[topic]);
            const query = topics.length ? `?topics=${encodeURIComponent(topics.join(','))}` : '';
            fetch(`${API_BASE}/api/regions${query}`)
                .then((r) => (r.ok ? r.json() : { regions: [] }))
                .then((d) => {
                    if (request === regionsRequest) window.trendMap.setRegions(d.regions || []);
                })
                .catch(() => {});
        }
        refreshRegions();

        let allTools = [];
        const selectedTools = {};

        const applyBtn = document.getElementById('apply');
        const timeintervallStartInput = document.getElementById('timeintervall-start');
        const timeintervallEndInput = document.getElementById('timeintervall-end');
        const timeintervallHint = document.getElementById('timeintervall-hint');
        const intervalValueInput = document.getElementById('interval-value');
        const intervalUnitSelect = document.getElementById('interval-unit');
        const intervalHint = document.getElementById('interval-hint');

        const topicsDropdown = document.getElementById('topics-dropdown');
        const topicsToggleBtn = document.getElementById('dropdown-toggle-btn');

        function sanitizeDateInput(inputElement) {
            const cleaned = inputElement.value.replace(/[^0-9.]/g, '');
            if (inputElement.value !== cleaned) {
                inputElement.value = cleaned;
            }
        }

        function parseDdMmYyyy(value) {
            const trimmed = value.trim();
            if (!/^\d{2}\.\d{2}\.\d{4}$/.test(trimmed)) {
                return null;
            }
            const [dayStr, monthStr, yearStr] = trimmed.split('.');
            const day = Number(dayStr);
            const month = Number(monthStr);
            const year = Number(yearStr);
            if (month < 1 || month > 12 || year < 1) {
                return null;
            }
            const dateObj = new Date(year, month - 1, day);
            if (
                dateObj.getFullYear() !== year ||
                dateObj.getMonth() !== month - 1 ||
                dateObj.getDate() !== day
            ) {
                return null;
            }
            return dateObj;
        }

        function isIntervalValueValid() {
            const raw = intervalValueInput.value.trim();
            if (raw.length === 0) {
                return false;
            }
            const parsed = Number(raw);
            return Number.isFinite(parsed) && parsed > 0;
        }

        function updateApplyButtonState() {
            sanitizeDateInput(timeintervallStartInput);
            sanitizeDateInput(timeintervallEndInput);

            const hasSelectedTopic = Object.values(selectedTopics).some(Boolean);
            const startRaw = timeintervallStartInput.value.trim();
            const endRaw = timeintervallEndInput.value.trim();
            const startDate = parseDdMmYyyy(startRaw);
            const endDate = parseDdMmYyyy(endRaw);
            const datesOrderValid = startDate && endDate ? endDate >= startDate : true;
            const startValid = Boolean(startDate);
            const endValid = Boolean(endDate) && datesOrderValid;
            const validInterval = isIntervalValueValid();

            timeintervallStartInput.classList.toggle('invalid', startRaw.length > 0 && !startValid);
            timeintervallEndInput.classList.toggle('invalid', endRaw.length > 0 && !endValid);
            timeintervallHint.classList.toggle(
                'visible',
                (startRaw.length > 0 && !startValid) || (endRaw.length > 0 && !endValid)
            );

            const rawInterval = intervalValueInput.value.trim();
            intervalValueInput.classList.toggle('invalid', rawInterval.length > 0 && !validInterval);
            intervalHint.classList.toggle('visible', rawInterval.length > 0 && !validInterval);

            applyBtn.disabled = !(
                hasSelectedTopic &&
                startValid &&
                endValid &&
                validInterval
            );
        }

        // Puts the dots in while typing: "01012020" -> "01.01.2020", "1.1." -> "01.01.".
        // `sizes` are the digit counts of the parts (day, month, year).
        function formatDateTyping(input, event, sizes = [2, 2, 4]) {
            const deleting = Boolean(event && event.inputType && event.inputType.startsWith('delete'));
            const raw = input.value;
            const caret = input.selectionStart ?? raw.length;
            const atEnd = caret >= raw.length;
            const digitsBeforeCaret = raw.slice(0, caret).replace(/\D/g, '').length;

            const parts = [''];
            for (const ch of raw) {
                const k = parts.length - 1;
                if (/\d/.test(ch)) {
                    if (parts[k].length >= sizes[k]) {
                        if (k + 1 >= sizes.length) continue;
                        parts.push('');
                    }
                    parts[parts.length - 1] += ch;
                } else if (ch === '.' && parts[k].length > 0 && k + 1 < sizes.length) {
                    // A dot after a single digit means "1." = "01.".
                    if (parts[k].length < sizes[k]) parts[k] = parts[k].padStart(sizes[k], '0');
                    parts.push('');
                }
            }
            let formatted = parts.join('.');
            const last = parts.length - 1;
            if (!deleting && last + 1 < sizes.length && parts[last].length === sizes[last]) formatted += '.';
            if (formatted === raw) return;
            input.value = formatted;
            if (atEnd) {
                input.setSelectionRange(formatted.length, formatted.length);
            } else {
                let seen = 0;
                let pos = 0;
                while (pos < formatted.length && seen < digitsBeforeCaret) {
                    if (/\d/.test(formatted[pos])) seen += 1;
                    pos += 1;
                }
                input.setSelectionRange(pos, pos);
            }
        }
        window.formatDateTyping = formatDateTyping;

        for (const input of [timeintervallStartInput, timeintervallEndInput]) {
            input.setAttribute('inputmode', 'decimal');
            input.addEventListener('input', (event) => {
                formatDateTyping(input, event);
                updateApplyButtonState();
            });
        }
        intervalValueInput.addEventListener('input', updateApplyButtonState);
        intervalUnitSelect.addEventListener('change', updateApplyButtonState);

        function renderTopics(filterText = '') {
            const listContainer = document.getElementById('topics-list');
            listContainer.innerHTML = '';

            const normalizedFilter = filterText.trim().toLowerCase();
            const matchingTopics = allTopics.filter((topic) =>
                topic.toLowerCase().includes(normalizedFilter)
            );

            if (matchingTopics.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-message';
                empty.textContent = 'No matching topics found.';
                listContainer.appendChild(empty);
                return;
            }

            for (const topic of matchingTopics) {
                const label = document.createElement('label');
                label.className = 'topic-item';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = Boolean(selectedTopics[topic]);
                checkbox.addEventListener('change', (event) => {
                    selectedTopics[topic] = event.target.checked;
                    updateApplyButtonState();
                    refreshRegions();
                });

                const span = document.createElement('span');
                span.textContent = topic;

                label.appendChild(checkbox);
                label.appendChild(span);
                listContainer.appendChild(label);
            }
        }

        async function loadTopics() {
            const listContainer = document.getElementById('topics-list');
            try {
                const response = await fetch(`${API_BASE}/api/topics`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                allTopics = [...data.topics].sort((a, b) => a.localeCompare(b));

                for (const topic of allTopics) {
                    if (!(topic in selectedTopics)) {
                        selectedTopics[topic] = false;
                    }
                }
                renderTopics(document.getElementById('topic-search').value);
                updateApplyButtonState();
            } catch (error) {
                listContainer.innerHTML =
                    '<div class="empty-message">Cannot reach Python server at http://127.0.0.1:8000. Make sure "python app.py" is running.</div>';
            }
        }

        // The analysis tools are chosen per time frame in the plot panel
        // (static/plots/plots.js). The task output below always runs all of them.
        async function loadTools() {
            try {
                const response = await fetch(`${API_BASE}/api/tools`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                allTools = [...data.tools].sort((a, b) => a.localeCompare(b));
                for (const tool of allTools) {
                    selectedTools[tool] = true;
                }
            } catch (error) {
                allTools = [];
            }
        }

        topicsToggleBtn.addEventListener('click', () => {
            topicsDropdown.classList.toggle('open');
            if (topicsDropdown.classList.contains('open')) {
                loadTopics();
            }
        });

        document.getElementById('topic-search').addEventListener('input', async (event) => {
            if (!topicsDropdown.classList.contains('open')) {
                topicsDropdown.classList.add('open');
            }
            if (allTopics.length === 0) {
                await loadTopics();
            } else {
                renderTopics(event.target.value);
            }
        });

        // Rounds a raw step to 1, 2, 2.5 or 5 times a power of ten for readable ticks.
        function niceStep(rawStep) {
            const power = Math.pow(10, Math.floor(Math.log10(rawStep)));
            const fraction = rawStep / power;
            const nice = fraction <= 1 ? 1 : fraction <= 2 ? 2 : fraction <= 2.5 ? 2.5 : fraction <= 5 ? 5 : 10;
            return nice * power;
        }

        function formatTick(value, step) {
            const decimals = Math.max(0, -Math.floor(Math.log10(step)) + (step % 1 === 0 ? 0 : 1));
            return value.toFixed(Math.min(decimals, 3));
        }

        // Time-series chart: one point per interval (x = interval start date,
        // y = mean value), with axes, gridlines, unit, tooltips and an optional
        // dashed linear trend. It is drawn at the host's real pixel width (1 SVG
        // unit = 1 CSS px), so text never scales and tick counts fit the space.
        function buildSvgChart(values, trendLine, labels, unit, pixelWidth) {
            if (!Array.isArray(values) || values.length === 0) {
                return '<div class="chart-empty">No numeric values in the selected time range.</div>';
            }
            const num = (v) => (typeof v === 'number' && Number.isFinite(v) ? v : null);
            const series = values.map(num);
            if (series.every((v) => v === null)) {
                return '<div class="chart-empty">No numeric values in the selected time range.</div>';
            }
            const n = series.length;
            const width = Math.max(240, Math.round(pixelWidth || 640));
            const height = 226;
            const right = 14;
            const top = 30;
            const bottom = 40;
            const charW = 6.4; // approx. width of one 11px label character (digits/dots)
            const unitText = unit ? ` ${unit}` : '';

            const trend = Array.isArray(trendLine) && trendLine.length === n ? trendLine.map(num) : null;
            const finite = [...series, ...(trend || [])].filter((v) => v !== null);
            let minV = Math.min(...finite);
            let maxV = Math.max(...finite);
            if (maxV - minV < 1e-9) {
                const pad = Math.abs(minV) > 1 ? Math.abs(minV) * 0.1 : 1;
                minV -= pad;
                maxV += pad;
            }
            const step = niceStep((maxV - minV) / 4);
            const yStart = Math.floor(minV / step) * step;
            const yEnd = Math.ceil(maxV / step) * step;
            const yTicks = [];
            for (let k = 0; yStart + k * step <= yEnd + step / 2; k++) {
                yTicks.push(yStart + k * step);
            }
            const yLabels = yTicks.map((v) => formatTick(v, step));
            const left = Math.ceil(Math.max(...yLabels.map((t) => t.length)) * charW) + 14;
            const plotW = width - left - right;
            const plotH = height - top - bottom;

            const toX = (i) => n <= 1 ? left + plotW / 2 : left + (i / (n - 1)) * plotW;
            const toY = (v) => top + plotH - ((v - yStart) / (yEnd - yStart)) * plotH;

            let svg = '';
            yTicks.forEach((v, k) => {
                const y = toY(v).toFixed(1);
                svg += `<line x1="${left}" x2="${width - right}" y1="${y}" y2="${y}" stroke="#eef2f7" />`;
                svg += `<text x="${left - 6}" y="${y}" text-anchor="end" dominant-baseline="middle">${yLabels[k]}</text>`;
            });
            if (unit) {
                svg += `<text x="4" y="${top - 10}" text-anchor="start">${escapeText(unit)}</text>`;
            }
            svg += `<line x1="${left}" x2="${left}" y1="${top}" y2="${top + plotH}" stroke="#94a3b8" />`;
            svg += `<line x1="${left}" x2="${width - right}" y1="${top + plotH}" y2="${top + plotH}" stroke="#94a3b8" />`;

            // x ticks: evenly spaced interval labels including the first and last;
            // start with as many as could fit and use fewer until none overlap
            const safeLabels = Array.isArray(labels) && labels.length === n ? labels.map(String) : series.map((_, i) => `#${i + 1}`);
            const gap = 10;
            const tickBox = (i) => {
                const x = toX(i);
                const w = safeLabels[i].length * charW;
                if (n > 1 && x - w / 2 < 2) return { i, x, tx: Math.max(2, x - 4), anchor: 'start', from: Math.max(2, x - 4), to: Math.max(2, x - 4) + w };
                if (n > 1 && x + w / 2 > width - 2) return { i, x, tx: Math.min(width - 2, x + 4), anchor: 'end', from: Math.min(width - 2, x + 4) - w, to: Math.min(width - 2, x + 4) };
                return { i, x, tx: x, anchor: 'middle', from: x - w / 2, to: x + w / 2 };
            };
            const maxLabelW = Math.max(...safeLabels.map((t) => t.length)) * charW + gap;
            let ticks = [tickBox(0)];
            for (let k = Math.min(n, Math.floor(plotW / maxLabelW) + 1); k >= 2; k--) {
                const indexes = [...new Set(Array.from({ length: k }, (_, j) => Math.round((j * (n - 1)) / (k - 1))))];
                const boxes = indexes.map(tickBox);
                if (boxes.every((box, j) => j === 0 || box.from >= boxes[j - 1].to + gap)) {
                    ticks = boxes;
                    break;
                }
            }
            for (const t of ticks) {
                svg += `<line x1="${t.x.toFixed(1)}" x2="${t.x.toFixed(1)}" y1="${top + plotH}" y2="${top + plotH + 4}" stroke="#94a3b8" />`;
                svg += `<text x="${t.tx.toFixed(1)}" y="${top + plotH + 16}" text-anchor="${t.anchor}">${escapeText(safeLabels[t.i])}</text>`;
            }
            svg += `<text x="${(left + plotW / 2).toFixed(1)}" y="${height - 6}" text-anchor="middle">interval start date</text>`;

            // series (gaps where a value is missing)
            const polyline = (vals, attrs) => {
                let segment = [];
                let out = '';
                const flush = () => {
                    if (segment.length > 1) out += `<polyline fill="none" ${attrs} points="${segment.join(' ')}" />`;
                    segment = [];
                };
                vals.forEach((v, i) => {
                    if (v === null) { flush(); return; }
                    segment.push(`${toX(i).toFixed(1)},${toY(v).toFixed(1)}`);
                });
                flush();
                return out;
            };
            svg += polyline(series, 'stroke="#2563eb" stroke-width="2"');
            if (trend) {
                svg += polyline(trend, 'stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"');
            }
            // smaller markers when points would touch (e.g. daily intervals)
            const dense = n > 1 && plotW / (n - 1) < 9;
            series.forEach((v, i) => {
                if (v === null) return;
                svg += `<circle cx="${toX(i).toFixed(1)}" cy="${toY(v).toFixed(1)}" r="${dense ? 1.6 : 3.5}" fill="#1d4ed8"${dense ? '' : ' stroke="#ffffff" stroke-width="1"'}>`
                    + `<title>${escapeText(safeLabels[i])}: ${v}${escapeText(unitText)}</title></circle>`;
            });

            return `<svg class="chart-svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img">${svg}</svg>`;
        }

        // Draws the chart at the host's current width and redraws it when the
        // card is resized (window resize, grid reflow).
        const chartResizeObserver = typeof ResizeObserver === 'function'
            ? new ResizeObserver((entries) => {
                for (const entry of entries) drawChartInto(entry.target);
            })
            : null;

        function drawChartInto(host) {
            const data = host._chartData;
            if (!data) return;
            const w = Math.floor(host.clientWidth);
            if (!w || w === host._chartWidth) return;
            host._chartWidth = w;
            host.innerHTML = buildSvgChart(data.values, data.trendLine, data.labels, data.unit, w);
        }

        function buildChartLegend(info, hasTrend) {
            const variables = Array.isArray(info.variables) && info.variables.length
                ? ` of ${info.variables.map(escapeText).join(', ')}`
                : '';
            let html = `<div class="chart-legend"><span><span style="color:#1d4ed8;">●</span> mean per interval${variables}</span>`;
            if (hasTrend) {
                html += '<span><span style="color:#dc2626;">╌╌</span> linear trend</span>';
            }
            return html + '</div>';
        }

        // opts (progressive 'Apply'): partial = more topics are coming (skip the coverage lookups
        // until the end), pending = topics not loaded yet, failed = why they will not load.
        function renderVisualization(visualization, opts = {}) {
            const container = document.getElementById('visualization-container');
            if (!visualization || !visualization.topics) {
                container.innerHTML = '<div class="empty-message">No visualization data available.</div>';
                return;
            }

            if (window.trendMap && Array.isArray(visualization.map_layers)) {
                window.trendMap.setResultData(visualization.map_layers);
                fitMapToSelectionAndStations(visualization.map_layers);
            }

            const entries = Object.entries(visualization.topics);
            if (entries.length === 0) {
                container.innerHTML = '<div class="empty-message">No topics selected.</div>';
                return;
            }

            if (chartResizeObserver) chartResizeObserver.disconnect();
            container.innerHTML = '';
            const chartHosts = [];
            for (const [topic, info] of entries) {
                const card = document.createElement('div');
                card.className = 'topic-viz-card';

                const tools = info.tools || {};
                const lr = tools['Linear Regression'];
                const tt = tools['t-Test'];
                const mk = tools['Mann-Kendall'];
                const values = Array.isArray(info.values) ? info.values : [];
                const show = (v) => (v === null || v === undefined || v === '' ? '–' : escapeText(String(v)));
                const badge = (text, title) => `<span class="metric-badge"${title ? ` title="${escapeText(title)}"` : ''}>${text}</span>`;
                const unavailable = (name, result) => `<span class="metric-badge metric-badge-muted" title="${escapeText(result.error || '')}">${name}: ${escapeText(result.error || 'not available')}</span>`;

                let badgesHtml = badge(`Mean: ${show(info.mean)}${info.unit && info.mean != null ? ' ' + escapeText(info.unit) : ''}`);
                badgesHtml += badge(`Intervals: ${values.length}`);
                if (lr) {
                    badgesHtml += badge(`Slope (w): ${show(lr.slope)}${info.unit ? ' ' + escapeText(info.unit) + '/interval' : ''}`);
                    badgesHtml += badge(`Intercept (b): ${show(lr.intercept)}`);
                }
                if (tt) {
                    if (tt.available === false) {
                        badgesHtml += unavailable('t-Test', tt);
                    } else {
                        badgesHtml += badge(`t-stat: ${show(tt.t_statistic)}`, 't-Test: first half vs. second half of the intervals');
                        badgesHtml += badge(`t-Test p: ${show(tt.p_value)}${tt.significant ? ' (significant)' : ''}`);
                    }
                }
                if (mk) {
                    if (mk.available === false) {
                        badgesHtml += unavailable('Mann-Kendall', mk);
                    } else {
                        badgesHtml += badge(`Mann-Kendall: ${show(mk.trend)}, p ${show(mk.p_value)}`, `tau ${mk.tau ?? '–'}, z ${mk.z_statistic ?? '–'}, S ${mk.s_statistic ?? '–'}`);
                    }
                }

                const st = info.station;
                const stationHtml = st
                    ? `<div class="station-line">📍 Measured at ${escapeText(st.name || st.id || 'station')}`
                      + `${st.id ? ` (${escapeText(st.id)})` : ''}: ${Number(st.latitude).toFixed(4)}, ${Number(st.longitude).toFixed(4)}`
                      + ` · ${st.distance_km} km from the selected point`
                      + `${st.source ? ` · source: ${escapeText(st.source)}` : ''}</div>`
                    : info.region && !info.error
                    ?`<div class="station-line">▦ Area mean of ${info.station_count ?? 'the'} stations in ${escapeText(info.region.name)}`
                      + (info.sources && Object.keys(info.sources).length
                          ? ` (${Object.entries(info.sources).map(([name, n]) => `${escapeText(name)} ${n}`).join(', ')})`
                          : '')
                      + (info.duplicates_removed ? ` · ${info.duplicates_removed} duplicate station(s) from other databases removed` : '')
                      + ' · each dot on the map is one station, coloured by its own trend</div>'
                    : '';
                const trendLine = lr ? lr.trend_line : null;
                const hasValues = values.some((v) => typeof v === 'number' && Number.isFinite(v));
                const coords = Array.isArray(info.coordinates) ? info.coordinates : null;
                card.innerHTML = `
                    <div class="topic-viz-header">
                        <span>${escapeText(topic)}</span>
                        ${coords ? `<span style="font-size:0.78rem;color:#64748b;white-space:nowrap;">[${coords[0]}, ${coords[1]}]</span>` : ''}
                    </div>
                    ${stationHtml}
                    ${info.error ? `<div class="topic-error">⚠ ${escapeText(info.error)}</div>` : ''}
                    <div class="badge-row">${badgesHtml}</div>
                    <div class="chart-host"></div>
                    ${hasValues ? buildChartLegend(info, Array.isArray(trendLine)) : ''}
                `;
                container.appendChild(card);
                const host = card.querySelector('.chart-host');
                host._chartData = { values, trendLine, labels: info.labels, unit: info.unit };
                if (!hasValues) {
                    host.innerHTML = buildSvgChart([], null, [], null);
                    if (!opts.partial) loadCoverage(card, topic);
                } else {
                    chartHosts.push(host);
                }
            }
            for (const topic of opts.pending || []) {
                const card = document.createElement('div');
                card.className = 'topic-viz-card';
                card.innerHTML = `<div class="topic-viz-header"><span>${escapeText(topic)}</span></div>`
                    + (opts.failed
                        ? `<div class="topic-error">⚠ Not loaded: ${escapeText(opts.failed)}</div>`
                        : '<div class="empty-message">Still loading…</div>');
                container.appendChild(card);
            }
            // Draw only after every card is in the grid, so each chart gets its final width.
            for (const host of chartHosts) {
                drawChartInto(host);
                if (chartResizeObserver) chartResizeObserver.observe(host);
            }
        }

        // ---- When do the stations here have data? (shown on cards without values) ----
        let lastRequestContext = null;

        function isoToDdMmYyyy(iso) {
            const [y, m, d] = String(iso).slice(0, 10).split('-');
            return `${d}.${m}.${y}`;
        }

        function yearOf(iso) {
            return Number(String(iso).slice(0, 4));
        }

        async function loadCoverage(card, topic) {
            const ctx = lastRequestContext;
            if (!ctx || !ctx.area) return;
            const box = document.createElement('div');
            box.className = 'coverage-box coverage-muted';
            box.textContent = 'Looking up when the stations here have data…';
            card.querySelector('.badge-row').before(box);
            try {
                const res = await fetch(`${API_BASE}/api/coverage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ area: ctx.area, topic, timeintervall: ctx.timeintervall }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
                renderCoverage(box, data);
            } catch (error) {
                box.textContent = `Could not look up when the stations here have data: ${error.message}`;
            }
        }

        // One bar per year: how many stations report the code; the requested time frame is shaded.
        function buildCoverageBars(code, requested, needed) {
            let first = code.years[0];
            let last = code.years[code.years.length - 1];
            const req = requested ? [yearOf(requested[0]), yearOf(requested[1])] : null;
            if (req) {
                first = Math.min(first, req[0]);
                last = Math.max(last, req[1]);
            }
            const span = last - first + 1;
            const maxCount = Math.max(needed, ...code.counts);
            const h = 30;
            const scale = (n) => (n / maxCount) * (h - 2);
            let svg = `<svg class="coverage-bars" viewBox="0 0 ${span} ${h}" preserveAspectRatio="none" role="img"`
                + ` aria-label="Stations reporting ${escapeText(code.code)} per year, ${first} to ${last}">`;
            if (req) {
                svg += `<rect class="request" x="${req[0] - first}" y="0" width="${req[1] - req[0] + 1}" height="${h}"><title>Your time frame: ${req[0]}–${req[1]}</title></rect>`;
            }
            const gap = span > 60 ? 0 : 0.15;
            code.years.forEach((year, i) => {
                const n = code.counts[i];
                if (!n) return;
                const bh = Math.max(scale(n), 1.5);
                svg += `<rect class="bar" x="${year - first + gap / 2}" y="${h - bh}" width="${1 - gap}" height="${bh}">`
                    + `<title>${year}: ${n} station${n === 1 ? '' : 's'}</title></rect>`;
            });
            if (needed > 1) {
                const y = h - scale(needed);
                svg += `<line class="need" x1="0" x2="${span}" y1="${y}" y2="${y}"><title>${needed} stations needed for an area</title></line>`;
            }
            svg += '</svg>';
            return svg + `<div class="coverage-axis"><span>${first}</span><span>${last}</span></div>`;
        }

        function renderCoverage(box, data) {
            box.classList.remove('coverage-muted');
            const where = data.scope === 'region'
                ? `in ${escapeText(data.place)}`
                : `within about ${data.radius_km} km`;
            if (!data.codes || data.codes.length === 0) {
                box.classList.add('coverage-muted');
                box.textContent = data.scope === 'region'
                    ? `No station in ${data.place} has ever reported this topic.`
                    : `No station within about ${data.radius_km} km has ever reported this topic. Try another place or topic.`;
                return;
            }
            const reqText = data.requested
                ? `${yearOf(data.requested[0])}–${yearOf(data.requested[1])}`
                : null;
            let html = `<div class="coverage-title">When is there data? Stations ${where}`
                + `${data.scope === 'region' ? ` (an area needs ${data.needed})` : ''}</div>`;
            data.codes.forEach((code, index) => {
                const label = code.name ? `${code.name} (${code.code})` : code.code;
                const inRange = code.in_range == null || !reqText
                    ? ''
                    : ` · <span class="muted">${code.in_range} cover ${reqText}</span>`;
                html += `<div class="coverage-code">`
                    + `<div class="coverage-code-head"><strong>${escapeText(label)}</strong>`
                    + `<span>${yearOf(code.first)}–${yearOf(code.last)} · ${code.station_count} station${code.station_count === 1 ? '' : 's'}${inRange}</span></div>`
                    + buildCoverageBars(code, data.requested, data.needed);
                if (index === 0 && code.stations.length) {
                    html += '<ul class="coverage-stations">' + code.stations.slice(0, 3).map((s) =>
                        `<li>${escapeText(s.name)}: ${yearOf(s.first)}–${yearOf(s.last)}`
                        + `${s.distance_km != null ? ` · ${s.distance_km} km` : ''}</li>`).join('') + '</ul>';
                }
                if (code.suggestion) {
                    const [a, b] = code.suggestion;
                    html += `<button type="button" class="coverage-use" data-start="${isoToDdMmYyyy(a)}" data-end="${isoToDdMmYyyy(b)}">`
                        + `Use ${isoToDdMmYyyy(a)} – ${isoToDdMmYyyy(b)}</button>`;
                }
                html += '</div>';
            });
            html += `<div class="coverage-legend"><span class="swatch" style="background:#0f766e"></span>stations reporting per year`
                + `${reqText ? ` &nbsp;<span class="swatch" style="background:#fed7aa"></span>your time frame` : ''}`
                + `${data.scope === 'region' ? ' &nbsp;┄ stations needed' : ''}</div>`;
            box.innerHTML = html;
            box.querySelectorAll('.coverage-use').forEach((button) => {
                button.addEventListener('click', () => {
                    timeintervallStartInput.value = button.dataset.start;
                    timeintervallEndInput.value = button.dataset.end;
                    updateApplyButtonState();
                    timeintervallStartInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                });
            });
        }

        // Zoom so the selected area and every measuring station are visible together;
        // a station can be tens of kilometres outside the selection.
        function fitMapToSelectionAndStations(mapLayers) {
            if (!window.trendMap || typeof window.trendMap.fitToBounds !== 'function') {
                return;
            }
            const points = [];
            const area = window.getSelectedArea ? window.getSelectedArea() : null;
            if (area && Array.isArray(area.bbox) && area.bbox.length === 4) {
                points.push([area.bbox[0], area.bbox[1]], [area.bbox[2], area.bbox[3]]);
            }
            for (const layer of mapLayers) {
                if (layer.id !== 'measuring-stations' || !layer.data) continue;
                for (const feature of layer.data.features || []) {
                    const c = feature.geometry && feature.geometry.coordinates;
                    if (Array.isArray(c) && c.length >= 2) points.push([c[0], c[1]]);
                }
            }
            if (points.length < 2) return;
            const lons = points.map((p) => p[0]);
            const lats = points.map((p) => p[1]);
            window.trendMap.fitToBounds([
                Math.min(...lons), Math.min(...lats), Math.max(...lons), Math.max(...lats),
            ]);
        }

        function escapeText(value) {
            const div = document.createElement('div');
            div.textContent = String(value);
            return div.innerHTML;
        }

        // Reads an NDJSON response body line by line, calling onMessage as each line arrives.
        async function readNdjson(body, onMessage) {
            const reader = body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            try {
                for (;;) {
                    const { value, done } = await reader.read();
                    buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
                    let nl;
                    while ((nl = buffer.indexOf('\n')) >= 0) {
                        const line = buffer.slice(0, nl).trim();
                        buffer = buffer.slice(nl + 1);
                        if (line) onMessage(JSON.parse(line));
                    }
                    if (done) break;
                }
                if (buffer.trim()) onMessage(JSON.parse(buffer));
            } catch (error) {
                reader.cancel().catch(() => {});
                throw error;
            }
        }

        let applyRun = null; // AbortController of the 'Apply' whose results are coming in

        async function triggerButton(buttonId) {
            if (applyRun) applyRun.abort();
            const run = new AbortController();
            applyRun = run;
            let shown = null; // result drawn so far, kept if a later part fails
            let pending = [];
            try {
                if (allTools.length === 0) {
                    await loadTools();
                }
                const intervalFloat = parseFloat(intervalValueInput.value.trim());
                if (!(Number.isFinite(intervalFloat) && intervalFloat > 0)) {
                    throw new Error('Interval length must be greater than 0.');
                }

                if (window.trendMap) {
                    window.trendMap.setLoading(true);
                }
                if (window.TrendPlots) window.TrendPlots.setLoading(true);

                const payload = {
                    topics: selectedTopics,
                    tools: selectedTools,
                    timeintervall: [
                        timeintervallStartInput.value.trim(),
                        timeintervallEndInput.value.trim(),
                    ],
                    interval_length: [
                        intervalFloat,
                        intervalUnitSelect.value,
                    ],
                    area: window.getSelectedArea ? window.getSelectedArea() : null,
                };
                // The coverage lookup of empty cards must use what this request was made with.
                lastRequestContext = { area: payload.area, timeintervall: payload.timeintervall };

                // Streamed answer: each topic is drawn as soon as it is evaluated (app.py _stream_apply).
                const res = await fetch(`${API_BASE}/api/buttons/${encodeURIComponent(buttonId)}/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: run.signal,
                });

                if (!res.ok || !res.body) {
                    throw new Error(`HTTP ${res.status}`);
                }

                let ur = null;
                let finished = false;
                await readNdjson(res.body, (msg) => {
                    if (run !== applyRun) return;
                    if (msg.type === 'request') {
                        ur = msg.user_request;
                        pending = Array.isArray(msg.topics) ? msg.topics.slice() : [];
                    } else if (msg.type === 'partial' || msg.type === 'done') {
                        finished = msg.type === 'done';
                        pending = finished ? [] : pending.filter((t) => t !== msg.topic);
                        shown = msg.visualization;
                        renderVisualization(shown, { partial: !finished, pending });
                        if (window.TrendPlots) window.TrendPlots.setData(shown, ur);
                    } else if (msg.type === 'error') {
                        throw new Error(msg.error);
                    }
                });
                if (!finished && run === applyRun) {
                    throw new Error('The connection closed before all topics were loaded.');
                }
            } catch (error) {
                if (run !== applyRun) return; // replaced by a newer 'Apply'
                const container = document.getElementById('visualization-container');
                if (shown) {
                    // Keep what is already drawn; only the missing topics show the error.
                    renderVisualization(shown, { pending, failed: error.message || String(error) });
                } else if (container) {
                    container.innerHTML =
                        '<div class="empty-message">Error: Could not submit the request. Ensure at least one topic, valid DD.MM.YYYY dates, and an interval length &gt; 0 are provided.</div>';
                }
            } finally {
                if (run === applyRun) {
                    applyRun = null;
                    if (window.trendMap) {
                        window.trendMap.setLoading(false);
                    }
                    if (window.TrendPlots) window.TrendPlots.setLoading(false);
                }
            }
        }

        document.querySelectorAll('button.py-button').forEach((buttonElement) => {
            buttonElement.addEventListener('click', () => {
                triggerButton(buttonElement.id);
            });
        });
    </script>
</body>
</html>
