<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendDetective</title>
    <link rel="stylesheet" href="/static/map-widget/map-widget.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            background-color: #f1f5f9;
            color: #0f172a;
        }

        /* Left Sidebar */
        .sidebar {
            width: 340px;
            flex-shrink: 0;
            background-color: #ffffff;
            border-right: 1px solid #e2e8f0;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 2px 0 12px rgba(15, 23, 42, 0.04);
        }

        /* Top-left Apply button row */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        button.py-button {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 0.6rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
        }
        button.py-button:hover:not(:disabled) {
            background-color: #1d4ed8;
        }
        button.py-button:active:not(:disabled) {
            transform: scale(0.98);
        }
        button.py-button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Form field groups (Timestamp & Interval length) */
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .field-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #475569;
        }
        .timestamp-row,
        .interval-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .timestamp-separator {
            font-weight: 600;
            color: #64748b;
            user-select: none;
        }
        .text-input,
        .select-input {
            width: 100%;
            padding: 0.55rem 0.75rem;
            font-size: 0.9rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            background-color: #ffffff;
            color: #0f172a;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .text-input:focus,
        .select-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .text-input.invalid {
            border-color: #dc2626;
        }
        .field-hint {
            font-size: 0.76rem;
            color: #dc2626;
            display: none;
        }
        .field-hint.visible {
            display: block;
        }

        /* Upper search bar */
        .search-wrapper {
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 0.6rem 0.85rem;
            font-size: 0.92rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .search-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Dropdown menu for Topics */
        .dropdown {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background-color: #ffffff;
            overflow: hidden;
        }
        .dropdown-toggle {
            width: 100%;
            background-color: #f8fafc;
            border: none;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            text-align: left;
        }
        .dropdown-toggle:hover {
            background-color: #f1f5f9;
        }
        .dropdown-arrow {
            font-size: 0.8rem;
            color: #64748b;
            transition: transform 0.2s ease;
        }
        .dropdown.open .dropdown-arrow {
            transform: rotate(180deg);
        }
        .dropdown-menu {
            display: none;
            border-top: 1px solid #e2e8f0;
            max-height: 360px;
            overflow-y: auto;
            padding: 0.4rem 0;
        }
        .dropdown.open .dropdown-menu {
            display: block;
        }

        /* Topic items with checkbox on the left */
        .topic-item {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            user-select: none;
            font-size: 0.92rem;
            transition: background-color 0.1s ease;
        }
        .topic-item:hover {
            background-color: #f8fafc;
        }
        .topic-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2563eb;
            cursor: pointer;
            margin: 0;
        }
        .empty-message {
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            color: #64748b;
            font-style: italic;
        }

        /* Main Visualization Workspace */
        .main-content {
            flex: 1;
            min-width: 0; /* let the map canvas shrink instead of squeezing the sidebar */
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        /* World map box: hosts the interactive map widget (map-widget/, built to static/map-widget/) */
        .map-box {
            position: relative;
            flex: 1;
            min-height: 480px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
        }
        .map-box #map-widget {
            position: absolute;
            inset: 0;
        }
        .status-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 1rem 1.25rem;
        }
        .status-card h3 {
            margin: 0 0 0.5rem 0;
            font-size: 0.95rem;
            color: #334155;
        }
        pre {
            margin: 0;
            background: #0f172a;
            color: #e2e8f0;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <!-- Left Sidebar -->
    <aside class="sidebar">
        <!-- Top-left Apply button (disabled until >=1 topic, filled timestamp, and valid interval > 0) -->
        <div class="top-bar">
            <button id="apply" class="py-button" type="button" disabled>Apply</button>
        </div>

        <!-- Timestamp brackets [start] - [end] above the search bar -->
        <div class="field-group">
            <span class="field-label">Timestamp</span>
            <div class="timestamp-row">
                <input
                    id="timestamp-start"
                    class="text-input"
                    type="text"
                    placeholder="Start"
                    aria-label="Start timestamp"
                >
                <span class="timestamp-separator">-</span>
                <input
                    id="timestamp-end"
                    class="text-input"
                    type="text"
                    placeholder="End"
                    aria-label="End timestamp"
                >
            </div>
        </div>

        <!-- Two-part Interval length: float (> 0) and unit (Day, Month, Year) -->
        <div class="field-group">
            <label class="field-label" for="interval-value">Interval Length</label>
            <div class="interval-row">
                <input
                    id="interval-value"
                    class="text-input"
                    type="number"
                    step="any"
                    min="0"
                    placeholder="Value (> 0)"
                    aria-label="Interval length value"
                >
                <select id="interval-unit" class="select-input" aria-label="Interval length unit">
                    <option value="Day">Day</option>
                    <option value="Month">Month</option>
                    <option value="Year">Year</option>
                </select>
            </div>
            <span id="interval-hint" class="field-hint">Value must be a number greater than 0.</span>
        </div>

        <!-- Upper search bar -->
        <div class="search-wrapper">
            <input
                id="topic-search"
                class="search-input"
                type="search"
                placeholder="Search topics..."
                aria-label="Search topics"
            >
        </div>

        <!-- Topics Dropdown Menu (starts closed) -->
        <div id="topics-dropdown" class="dropdown">
            <button id="dropdown-toggle-btn" class="dropdown-toggle" type="button">
                <span>Topics</span>
                <span class="dropdown-arrow">&#9662;</span>
            </button>
            <div id="topics-list" class="dropdown-menu"></div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <!-- World map: draw an area with the tools on the left of the map; it is sent with "Apply" -->
        <div class="map-box" aria-label="TrendDetective World Map">
            <div id="map-widget"></div>
        </div>

        <div class="status-card">
            <h3>Latest Python <code>UserRequest</code> State</h3>
            <pre id="user-request-output">Fill timestamp, interval length (> 0), and select at least one topic, then click "Apply"...</pre>
        </div>
    </main>

    <script type="module" src="/static/map-widget/map-widget.js"></script>
    <script type="module">
        // Mount the map widget into the map box. The selected area (GeoJSON) is kept in
        // selectedArea and sent to Python with the Apply request.
        let selectedArea = null;
        window.trendMap = window.TrendDetectiveMap.mount(document.getElementById('map-widget'), {
            onAreaSelected: (area) => {
                selectedArea = area;
            },
            onAreaCleared: () => {
                selectedArea = null;
            },
        });
        window.getSelectedArea = () => selectedArea;
    </script>

    <script>
        // Same origin on Vercel and on the local Python server (port 8000); otherwise talk to the local server.
        const API_BASE = (window.location.port === '8000' || !['localhost', '127.0.0.1'].includes(window.location.hostname)) ? '' : 'http://127.0.0.1:8000';

        let allTopics = [];
        const selectedTopics = {};

        const applyBtn = document.getElementById('apply');
        const timestampStartInput = document.getElementById('timestamp-start');
        const timestampEndInput = document.getElementById('timestamp-end');
        const intervalValueInput = document.getElementById('interval-value');
        const intervalUnitSelect = document.getElementById('interval-unit');
        const intervalHint = document.getElementById('interval-hint');
        const dropdown = document.getElementById('topics-dropdown');
        const dropdownToggleBtn = document.getElementById('dropdown-toggle-btn');

        function isIntervalValueValid() {
            const raw = intervalValueInput.value.trim();
            if (raw.length === 0) {
                return false;
            }
            const parsed = Number(raw);
            return Number.isFinite(parsed) && parsed > 0;
        }

        // Enable Apply only when >= 1 topic is checked, both timestamps are filled, and interval > 0
        function updateApplyButtonState() {
            const hasSelectedTopic = Object.values(selectedTopics).some(Boolean);
            const hasStartTimestamp = timestampStartInput.value.trim().length > 0;
            const hasEndTimestamp = timestampEndInput.value.trim().length > 0;
            const validInterval = isIntervalValueValid();

            const rawInterval = intervalValueInput.value.trim();
            if (rawInterval.length > 0 && !validInterval) {
                intervalValueInput.classList.add('invalid');
                intervalHint.classList.add('visible');
            } else {
                intervalValueInput.classList.remove('invalid');
                intervalHint.classList.remove('visible');
            }

            applyBtn.disabled = !(
                hasSelectedTopic &&
                hasStartTimestamp &&
                hasEndTimestamp &&
                validInterval
            );
        }

        timestampStartInput.addEventListener('input', updateApplyButtonState);
        timestampEndInput.addEventListener('input', updateApplyButtonState);
        intervalValueInput.addEventListener('input', updateApplyButtonState);
        intervalUnitSelect.addEventListener('change', updateApplyButtonState);

        // Render the topic checkboxes inside the dropdown, filtered by the search query
        function renderTopics(filterText = '') {
            const listContainer = document.getElementById('topics-list');
            listContainer.innerHTML = '';

            const normalizedFilter = filterText.trim().toLowerCase();
            const matchingTopics = allTopics.filter((topic) =>
                topic.toLowerCase().includes(normalizedFilter)
            );

            if (matchingTopics.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-message';
                empty.textContent = 'No matching topics found.';
                listContainer.appendChild(empty);
                return;
            }

            for (const topic of matchingTopics) {
                const label = document.createElement('label');
                label.className = 'topic-item';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = Boolean(selectedTopics[topic]);
                checkbox.addEventListener('change', (event) => {
                    selectedTopics[topic] = event.target.checked;
                    updateApplyButtonState();
                });

                const span = document.createElement('span');
                span.textContent = topic;

                label.appendChild(checkbox);
                label.appendChild(span);
                listContainer.appendChild(label);
            }
        }

        // Load topics from Python marten.getTopics() and sort alphabetically
        async function loadTopics() {
            const listContainer = document.getElementById('topics-list');
            try {
                const response = await fetch(`${API_BASE}/api/topics`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                allTopics = [...data.topics].sort((a, b) => a.localeCompare(b));

                for (const topic of allTopics) {
                    if (!(topic in selectedTopics)) {
                        selectedTopics[topic] = false;
                    }
                }
                renderTopics(document.getElementById('topic-search').value);
                updateApplyButtonState();
            } catch (error) {
                listContainer.innerHTML =
                    '<div class="empty-message">Cannot reach Python server at http://127.0.0.1:8000. Make sure "python app.py" is running.</div>';
            }
        }

        // Toggle the Topics dropdown menu open/closed, loading topics from Python when opened
        dropdownToggleBtn.addEventListener('click', () => {
            dropdown.classList.toggle('open');
            if (dropdown.classList.contains('open')) {
                loadTopics();
            }
        });

        // Filter topics when typing in the upper search bar
        document.getElementById('topic-search').addEventListener('input', async (event) => {
            if (!dropdown.classList.contains('open')) {
                dropdown.classList.add('open');
            }
            if (allTopics.length === 0) {
                await loadTopics();
            } else {
                renderTopics(event.target.value);
            }
        });

        // Short summary of the selected map area for the status card
        function formatArea(area) {
            if (!area) {
                return 'None';
            }
            const p = area.properties || {};
            return `${p.selectionId} (${p.shape}, ${Math.round(p.areaKm2).toLocaleString('en-US')} km², bbox=${JSON.stringify(area.bbox)})`;
        }

        // Trigger the connected Python Button method
        async function triggerButton(buttonId) {
            try {
                const intervalFloat = parseFloat(intervalValueInput.value.trim());
                if (!(Number.isFinite(intervalFloat) && intervalFloat > 0)) {
                    throw new Error('Interval length must be greater than 0.');
                }

                const payload = {
                    topics: selectedTopics,
                    timestamp: [
                        timestampStartInput.value.trim(),
                        timestampEndInput.value.trim(),
                    ],
                    interval_length: [
                        intervalFloat,
                        intervalUnitSelect.value,
                    ],
                    // Area drawn on the map (GeoJSON Feature) or null; see map-widget/API.md
                    area: window.getSelectedArea ? window.getSelectedArea() : null,
                };

                const postRes = await fetch(`${API_BASE}/api/buttons/${encodeURIComponent(buttonId)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                if (!postRes.ok) {
                    throw new Error(`HTTP ${postRes.status}`);
                }

                const res = await fetch(`${API_BASE}/api/user-request`);
                const data = await res.json();
                const [val, unit] = data.user_request.interval_length;
                const formattedFloat = Number.isInteger(val) ? `${val}.0` : String(val);
                document.getElementById('user-request-output').textContent =
                    `UserRequest(\n  topics=${JSON.stringify(data.user_request.topics, null, 2)},\n  timestamp=(${JSON.stringify(data.user_request.timestamp[0])}, ${JSON.stringify(data.user_request.timestamp[1])}),\n  interval_length=(${formattedFloat}, ${JSON.stringify(unit)}),\n  area=${formatArea(data.user_request.area)}\n)`;
            } catch (error) {
                document.getElementById('user-request-output').textContent =
                    'Error: Could not submit UserRequest. Ensure at least one topic, both timestamp brackets, and an interval length > 0 are provided.';
            }
        }

        // Connect every HTML button with class="py-button" to its Python Button via id
        document.querySelectorAll('button.py-button').forEach((buttonElement) => {
            buttonElement.addEventListener('click', () => {
                triggerButton(buttonElement.id);
            });
        });
    </script>
</body>
</html>
