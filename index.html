<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendDetective</title>
    <link rel="stylesheet" href="/static/map-widget/map-widget.css">
    <link rel="stylesheet" href="/static/plots/plots.css">
    <link rel="stylesheet" href="/static/plots/evolution.css">
    <link rel="stylesheet" href="/static/plots/compare.css">
    <link rel="stylesheet" href="/static/plots/simple.css">
    <link rel="stylesheet" href="/static/mode.css">
    <link rel="stylesheet" href="/static/box-stations.css">
    <script src="/static/mode.js"></script>
    <link rel="stylesheet" href="/static/sidebar.css">
    <script src="/static/sidebar.js"></script>
    <link rel="stylesheet" href="/static/help.css">
    <script src="/static/help.js" defer></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            background-color: #f1f5f9;
            color: #0f172a;
        }

        /* Left Sidebar */
        .sidebar {
            width: 340px;
            flex-shrink: 0;
            background-color: #ffffff;
            border-right: 1px solid #e2e8f0;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 2px 0 12px rgba(15, 23, 42, 0.04);
        }

        button.py-button {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 0.6rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
        }
        button.py-button:hover:not(:disabled) {
            background-color: #1d4ed8;
        }
        button.py-button:active:not(:disabled) {
            transform: scale(0.98);
        }
        button.py-button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .text-input,
        .select-input {
            width: 100%;
            padding: 0.55rem 0.75rem;
            font-size: 0.9rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            background-color: #ffffff;
            color: #0f172a;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .text-input::placeholder {
            color: #94a3b8;
            opacity: 1;
        }
        .text-input:focus,
        .select-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .text-input.invalid {
            border-color: #dc2626;
        }
        .field-hint {
            font-size: 0.76rem;
            color: #dc2626;
            display: none;
        }
        .field-hint.visible {
            display: block;
        }

        /* Upper search bar */
        .search-wrapper {
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 0.6rem 0.85rem;
            font-size: 0.92rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .search-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Dropdown menus for Topics and Tools */
        .dropdown {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background-color: #ffffff;
            overflow: hidden;
        }
        .dropdown-menu {
            display: none;
            border-top: 1px solid #e2e8f0;
            max-height: 260px;
            overflow-y: auto;
            padding: 0.4rem 0;
        }
        .dropdown.open .dropdown-menu {
            display: block;
        }

        /* Items with checkbox on the left */
        .topic-item {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            user-select: none;
            font-size: 0.92rem;
            transition: background-color 0.1s ease;
        }
        .topic-item:hover {
            background-color: #f8fafc;
        }
        .topic-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #2563eb;
            cursor: pointer;
            margin: 0;
        }
        .empty-message {
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            color: #64748b;
            font-style: italic;
        }

        /* Main Visualization Workspace */
        .main-content {
            flex: 1;
            min-width: 0;
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        .map-box {
            position: relative;
            flex: 1;
            min-height: 420px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
        }
        .map-box #map-widget {
            position: absolute;
            inset: 0;
        }
        .status-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 1rem 1.25rem;
        }
        .status-card h3 {
            margin: 0 0 0.75rem 0;
            font-size: 0.95rem;
            color: #334155;
        }
        .task-output > summary { cursor: pointer; list-style-position: inside; }
        .task-output > summary h3 { display: inline; margin: 0; }
        .task-output[open] > summary { margin-bottom: 0.75rem; }
        .viz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
        }
        .avail-list {
            grid-column: 1 / -1;
            list-style: none;
            margin: 0 0 0.25rem;
            padding: 0.5rem 0.7rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 1.1rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f8fafc;
            font-size: 0.82rem;
        }
        .avail-list li { display: flex; align-items: baseline; gap: 0.35rem; }
        .avail-mark { font-weight: 700; }
        .avail-ok .avail-mark { color: #15803d; }
        .avail-bad { color: #9f1d1d; }
        .avail-bad .avail-mark { color: #b91c1c; }
        .avail-wait { color: #64748b; }
        .avail-sub { color: #64748b; font-size: 0.76rem; }
        .avail-bad .avail-sub { color: #b45454; }
        .topic-viz-card.is-failed { border-left: 3px solid #dc2626; }
        .topic-viz-card {
            min-width: 0;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.85rem 1rem;
            background: #f8fafc;
        }
        .topic-viz-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.92rem;
        }
        .badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 0.6rem;
        }
        .topic-error {
            font-size: 0.8rem;
            color: #991b1b;
            background: #fee2e2;
            border-radius: 6px;
            padding: 4px 8px;
            margin: 6px 0;
        }
        .coverage-box {
            font-size: 0.8rem;
            color: #334155;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 6px 8px;
            margin: 6px 0;
        }
        .coverage-box.coverage-muted { color: #64748b; }
        .coverage-title { font-weight: 600; margin-bottom: 4px; }
        .coverage-code { margin-top: 6px; }
        .coverage-code-head { display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; }
        .coverage-code-head .muted { color: #64748b; }
        .coverage-bars { display: block; width: 100%; height: 34px; margin-top: 3px; }
        .coverage-bars rect.bar { fill: #0f766e; }
        .coverage-bars rect.bar:hover { fill: #134e4a; }
        .coverage-bars rect.request { fill: #fed7aa; }
        .coverage-bars line.need { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 3 2; vector-effect: non-scaling-stroke; }
        .coverage-axis { display: flex; justify-content: space-between; color: #64748b; font-size: 0.72rem; }
        .coverage-legend { color: #64748b; font-size: 0.72rem; margin-top: 2px; }
        .coverage-legend .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: -1px; margin-right: 3px; }
        .coverage-stations { margin: 4px 0 0; padding-left: 16px; color: #475569; }
        .coverage-use {
            margin-top: 4px;
            font: inherit;
            font-size: 0.78rem;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid #0f766e;
            background: #fff;
            color: #0f766e;
            cursor: pointer;
        }
        .coverage-use:hover { background: #0f766e; color: #fff; }
        .station-line {
            font-size: 0.8rem;
            color: #334155;
            background: #f8fafc;
            border-left: 2px solid #94a3b8;
            border-radius: 0;
            padding: 4px 8px;
            margin: 6px 0;
            font-variant-numeric: tabular-nums;
        }

        .metric-badge {
            font-size: 0.76rem;
            padding: 0.15rem 0.5rem;
            border-radius: 3px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            color: #334155;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }
        .metric-badge-muted {
            background: #f1f5f9;
            color: #64748b;
            font-weight: 400;
        }
        .chart-host {
            min-width: 0;
        }
        .chart-svg {
            max-width: 100%;
            height: auto;
            background: #ffffff;
            box-shadow: 0 0 0 1px #e2e8f0;
            border-radius: 6px;
            display: block;
        }
        .chart-svg text {
            font-family: inherit;
            font-size: 11px;
            fill: #64748b;
        }
        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            font-size: 0.75rem;
            color: #475569;
            margin-top: 4px;
        }
        .chart-empty {
            font-size: 0.8rem;
            color: #64748b;
            padding: 16px;
            text-align: center;
            border: 1px dashed #cbd5e1;
            border-radius: 6px;
        }
        /* City / region search on the map */
        .place-search {
            position: absolute;
            top: 10px;
            right: 52px;
            width: min(300px, calc(100% - 120px));
            z-index: 5;
            font-size: 0.85rem;
        }
        .place-search input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.5rem 2rem 0.5rem 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.18);
            font: inherit;
            color: #1f2933;
        }
        .place-search input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }
        .place-search-status {
            position: absolute;
            right: 0.6rem;
            top: 0.5rem;
            color: #94a3b8;
            pointer-events: none;
        }
        .place-results {
            list-style: none;
            margin: 4px 0 0;
            padding: 4px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.2);
            max-height: 300px;
            overflow-y: auto;
        }
        .place-results[hidden] { display: none; }
        .place-results li {
            padding: 0.45rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            line-height: 1.3;
        }
        .place-results li[aria-selected="true"],
        .place-results li:hover { background: #eff6ff; }
        .place-results .place-name { font-weight: 600; color: #1e293b; }
        .place-results .place-kind {
            margin-left: 0.4rem;
            font-size: 0.72rem;
            color: #64748b;
            text-transform: capitalize;
        }
        .place-results .place-label {
            display: block;
            font-size: 0.75rem;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .place-results .place-empty { cursor: default; color: #64748b; }
        .place-results .place-empty:hover { background: none; }

        /* Apply status: what is still missing */
        .apply-status { font-size: 0.78rem; color: #64748b; line-height: 1.35; }
        .apply-status strong { color: #b45309; font-weight: 600; }

        /* Variable without data in the selected region (data/region_variables.json) */
        .topic-item .no-area-data { color: #dc2626; font-weight: 700; margin-left: 0.3rem; }

        /* Grouped topic list */
        .topic-item .topic-text { display: flex; flex-direction: column; min-width: 0; }
        .topic-item .topic-name { color: #0f172a; }
        .topic-item .topic-meta { font-size: 0.7rem; color: #94a3b8; }
        .topic-kind {
            display: inline-block;
            margin-left: 4px;
            padding: 0 5px;
            border-radius: 999px;
            font-size: 0.66rem;
            font-weight: 600;
            vertical-align: 1px;
        }
        .topic-kind.model { background: #fef3c7; color: #92400e; }
        .topic-kind.satellite { background: #e0f2fe; color: #075985; }
        .topic-kind.marine { background: #ccfbf1; color: #115e59; }
        .topic-kind.hourly { background: #f1f5f9; color: #475569; }
        .dropdown-count { margin-left: auto; margin-right: 0.5rem; font-size: 0.75rem; color: #2563eb; font-weight: 600; }

        /* Suggested case studies (GET /api/examples): one scrolling row of event cards */
        .examples-strip {
            --cs-heat: #c2410c;
            --cs-cold: #2563eb;
            --cs-rain: #0f766e;
            --cs-snow: #6366f1;
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            min-width: 0;
        }
        .examples-strip[hidden] { display: none; }
        .examples-label {
            flex: none;
            display: flex;
            flex-direction: column;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            line-height: 1.25;
        }
        .examples-label small { font-size: 0.68rem; font-weight: 400; text-transform: none; letter-spacing: 0; color: #94a3b8; }
        .examples-viewport { position: relative; flex: 1 1 auto; min-width: 0; }
        .examples-list {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            scroll-snap-type: x proximity;
            scroll-behavior: smooth;
            scrollbar-width: none;
            padding: 2px;
            -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 var(--fade-l, 0px), #000 calc(100% - var(--fade-r, 0px)), transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 var(--fade-l, 0px), #000 calc(100% - var(--fade-r, 0px)), transparent 100%);
        }
        .examples-list::-webkit-scrollbar { display: none; }
        .examples-viewport.can-left .examples-list { --fade-l: 36px; }
        .examples-viewport.can-right .examples-list { --fade-r: 36px; }
        .ex-card {
            flex: 0 0 auto;
            width: 228px;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.7rem 0.5rem 0.55rem;
            scroll-snap-align: start;
            font: inherit;
            text-align: left;
            color: inherit;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }
        .ex-card:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--ex-color) 45%, #e2e8f0); box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08); }
        .ex-card:focus-visible { outline: 2px solid var(--ex-color); outline-offset: 1px; }
        .ex-card:disabled { cursor: progress; opacity: 0.55; transform: none; }
        .ex-card.is-running { opacity: 1; border-color: var(--ex-color); }
        .ex-icon {
            flex: none;
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            color: var(--ex-color);
            background: color-mix(in srgb, var(--ex-color) 11%, #ffffff);
        }
        .ex-icon svg { width: 19px; height: 19px; }
        .ex-card.is-running .ex-icon svg { animation: ex-pulse 0.9s ease-in-out infinite alternate; }
        @keyframes ex-pulse { to { transform: scale(0.75); opacity: 0.5; } }
        .ex-text { display: flex; flex-direction: column; min-width: 0; gap: 0.05rem; }
        .ex-value { font-size: 0.92rem; font-weight: 700; color: #0f172a; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .ex-title, .ex-place { font-size: 0.72rem; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ex-title { color: #334155; font-weight: 600; }
        .ex-nav {
            position: absolute;
            top: 50%;
            z-index: 1;
            width: 28px;
            height: 28px;
            display: none;
            place-items: center;
            padding: 0;
            transform: translateY(-50%);
            border: 1px solid #e2e8f0;
            border-radius: 50%;
            background: #ffffff;
            color: #334155;
            font-size: 1rem;
            line-height: 1;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.12);
            cursor: pointer;
        }
        .ex-nav:hover { color: #2563eb; }
        .ex-prev { left: -6px; }
        .ex-next { right: -6px; }
        .examples-viewport.can-left .ex-prev,
        .examples-viewport.can-right .ex-next { display: grid; }
        @media (max-width: 620px) {
            .examples-strip { flex-direction: column; align-items: stretch; gap: 0.35rem; }
            .examples-label { flex-direction: row; gap: 0.4rem; align-items: baseline; }
            .ex-card { width: 200px; }
        }

        /* Map legend and satellite bar (inside .map-box) */
        .map-legend {
            position: absolute;
            left: 10px;
            bottom: 34px;
            z-index: 4;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.18);
            padding: 0.4rem 0.6rem;
            font-size: 0.72rem;
            color: #334155;
            max-width: 240px;
        }
        .map-legend[hidden] { display: none; }
        .map-legend-title { font-weight: 700; margin-bottom: 2px; cursor: pointer; }
        .map-legend details:not([open]) .map-legend-title { margin-bottom: 0; }
        .map-legend-row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
        .map-legend-dot { width: 11px; height: 11px; border-radius: 50%; border: 1px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.15); flex: none; }
        .satellite-bar {
            position: absolute;
            top: 54px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4;
            background: rgba(15, 23, 42, 0.88);
            color: #fff;
            border-radius: 999px;
            padding: 0.3rem 0.4rem 0.3rem 0.85rem;
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }
        .satellite-bar[hidden] { display: none; }
        .satellite-bar button {
            font: inherit;
            border: none;
            border-radius: 999px;
            padding: 0.15rem 0.6rem;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
        }
        .satellite-bar button:hover { background: rgba(255, 255, 255, 0.32); }

        /* Result cards: trend headline and events */
        .trend-headline { font-size: 0.85rem; margin: 4px 0; color: #0f172a; font-variant-numeric: tabular-nums; }
        .trend-headline .sig { font-size: 0.74rem; margin-left: 6px; color: #475569; }
        .trend-headline .sig.no { color: #94a3b8; }
        .event-chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
        .event-chip {
            font: inherit;
            font-size: 0.74rem;
            font-variant-numeric: tabular-nums;
            border: 1px solid #cbd5e1;
            border-left: 2px solid #a4553d;
            background: #fff;
            color: #334155;
            border-radius: 3px;
            padding: 1px 7px;
            cursor: pointer;
        }
        .event-chip.cold { border-left-color: #3d6a93; }
        .event-chip:hover { background: #f5f7fa; }

        /* The sidebar is one screen high and stays in place; the topic list fills
           everything below the inputs and scrolls on its own. */
        .sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        .sidebar > * { flex-shrink: 0; }
        .sidebar > .sb-variables {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .sb-variables > * { flex-shrink: 0; }
        .sb-variables > #topics-dropdown {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        #topics-dropdown .dropdown-menu { max-height: none; flex: 1 1 auto; min-height: 0; padding: 0; }

        /* Topic categories: one collapsible section each */
        .topic-group { border-bottom: 1px solid #eef2f6; }
        .topic-group:last-child { border-bottom: 0; }
        .topic-group > summary {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 0.85rem;
            cursor: pointer;
            user-select: none;
            font-size: 0.86rem;
            font-weight: 600;
            color: #0f172a;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .topic-group > summary::-webkit-details-marker { display: none; }
        .topic-group > summary:hover { background: #f8fafc; }
        .topic-group > summary:focus-visible { outline: 2px solid #2563eb; outline-offset: -2px; }
        .topic-group-chevron {
            width: 12px;
            height: 12px;
            flex: 0 0 12px;
            color: #64748b;

    <script>
        // City / region search: type a name, pick a result, the map zooms there.
        (function () {
            const input = document.getElementById('place-search');
            const list = document.getElementById('place-results');
            const status = document.getElementById('place-search-status');
            if (!input || !list) return;
            const base = window.location.protocol.startsWith('http') ? '' : 'http://127.0.0.1:8000';
            let results = [];
            let active = -1;
            let timer = null;
            let requestNo = 0;

            const esc = (text) => String(text ?? '').replace(/[&<>"']/g, (c) => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

            function setOpen(open) {
                list.hidden = !open;
                input.setAttribute('aria-expanded', String(open));
            }

            function render(message) {
                if (message) {
                    list.innerHTML = `<li class="place-empty">${esc(message)}</li>`;
                } else {
                    list.innerHTML = results.map((p, i) => `
                        <li role="option" id="place-opt-${i}" data-i="${i}" aria-selected="${i === active}">
                            <span class="place-name">${esc(p.name)}</span><span class="place-kind">${esc(p.kind)}</span>
                            <span class="place-label">${esc(p.label)}</span>
                        </li>`).join('');
                }
                input.setAttribute('aria-activedescendant', active >= 0 ? `place-opt-${active}` : '');
                setOpen(true);
            }

            // Nominatim boxes can include far-away islands (Tokyo reaches 20°N). When the
            // place's centre sits near the edge of its box, zoom to the surroundings instead.
            function viewBox(place) {
                const [w, s, e, n] = place.bbox;
                const width = e - w, height = n - s;
                const fx = width > 0 ? (place.lon - w) / width : 0.5;
                const fy = height > 0 ? (place.lat - s) / height : 0.5;
                const lopsided = fx < 0.15 || fx > 0.85 || fy < 0.15 || fy > 0.85;
                if (lopsided && (width > 2 || height > 2)) {
                    return [place.lon - 0.5, place.lat - 0.35, place.lon + 0.5, place.lat + 0.35];
                }
                if (width < 0.02 && height < 0.02) {
                    return [place.lon - 0.05, place.lat - 0.035, place.lon + 0.05, place.lat + 0.035];
                }
                return [w, s, e, n];
            }

            // Settlements become the evaluation point (their measuring station is found
            // near it). Areas can only be the predefined regions, so for states, counties,
            // countries etc. the map zooms there and shows the regions (Areas).
            const POINT_KINDS = new Set(['city', 'town', 'village', 'hamlet', 'suburb', 'quarter',
                'neighbourhood', 'borough', 'city district', 'municipality', 'locality', 'coordinates']);

            function placeArea(place) {
                const properties = { placeName: place.name, placeLabel: place.label };
                const [w, s, e, n] = viewBox(place);
                if (POINT_KINDS.has(place.kind) || (e - w < 0.2 && n - s < 0.2)) {
                    return { type: 'Feature', properties: { ...properties, shape: 'point' },
                        geometry: { type: 'Point', coordinates: [place.lon, place.lat] } };
                }
                return null;
            }

            function choose(i) {
                const place = results[i];
                if (!place) return;
                input.value = place.name;
                setOpen(false);
                const map = window.trendMap;
                if (!map) return;
                const area = placeArea(place);
                if (area && typeof map.setArea === 'function') map.setArea(area);
                if (!area && typeof map.showRegions === 'function') map.showRegions(true);
                if (typeof map.fitToBounds === 'function') map.fitToBounds(viewBox(place));
            }

            async function search(query, chooseFirst = false) {
                const no = ++requestNo;
                status.textContent = '…';
                try {
                    const res = await fetch(`${base}/api/places?q=${encodeURIComponent(query)}`);
                    const data = await res.json().catch(() => ({}));
                    if (no !== requestNo) return;
                    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
                    results = data.places || [];
                    active = results.length ? 0 : -1;
                    render(results.length ? '' : `No place found for "${query}".`);
                    if (chooseFirst && results.length) choose(0);
                } catch (err) {
                    if (no !== requestNo) return;
                    results = [];
                    active = -1;
                    render(err.message || 'Search failed.');
                } finally {
                    if (no === requestNo) status.textContent = '';
                }
            }

            input.addEventListener('input', () => {
                clearTimeout(timer);
                const query = input.value.trim();
                if (query.length < 2) {
                    requestNo++;
                    results = [];
                    status.textContent = '';
                    setOpen(false);
                    return;
                }
                timer = setTimeout(() => search(query), 450);
            });

            input.addEventListener('keydown', (event) => {
                if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                    if (!results.length) return;
                    event.preventDefault();
                    const step = event.key === 'ArrowDown' ? 1 : -1;
                    active = (active + step + results.length) % results.length;
                    render();
                } else if (event.key === 'Enter') {
                    event.preventDefault();
                    if (!list.hidden && active >= 0) {
                        choose(active);
                    } else if (input.value.trim().length >= 2) {
                        // Enter before the suggestions arrived: take the best match directly.
                        clearTimeout(timer);
                        search(input.value.trim(), true);
                    }
                } else if (event.key === 'Escape') {
                    setOpen(false);
                }
            });

            // mousedown (not click) so the choice lands before the input loses focus
            list.addEventListener('mousedown', (event) => {
                const item = event.target.closest('li[data-i]');
                if (!item) return;
                event.preventDefault();
                choose(Number(item.dataset.i));
            });
            input.addEventListener('focus', () => { if (results.length) render(); });
            input.addEventListener('blur', () => setOpen(false));
        })();
    </script>
    <script src="/static/plots/plots.js"></script>

    <script type="module" src="/static/map-widget/map-widget.js"></script>
    <script type="module">
        let selectedArea = null;
        if (window.TrendDetectiveMap) {
            window.trendMap = window.TrendDetectiveMap.mount(document.getElementById('map-widget'), {
                onAreaSelected: (area) => {
                    selectedArea = area;
                    window.dispatchEvent(new Event('trend:area'));
                },
                onAreaCleared: () => {
                    selectedArea = null;
                    // Deleting the selection also removes its results from the map (area outline, station dots).
                    window.lastMapLayers = [];
                    window.refreshMapLayers();
                    if (window.updateMapLegend) window.updateMapLegend([]);
                    window.dispatchEvent(new Event('trend:area'));
                },
                // A station dot of a box or area: analyse that station alone (static/box-stations.js).
                onFeatureClick: (hit) => Boolean(window.onMapFeatureClick && window.onMapFeatureClick(hit)),
                onFocusCleared: () => window.clearAreaFocus && window.clearAreaFocus(),
            });
        }
        // The area on the map; getSelectedArea answers the picked station instead while one is picked.
        window.getDrawnArea = () => selectedArea;
        window.getSelectedArea = () => (window.areaFocusPoint && window.areaFocusPoint()) || selectedArea;
        // The regions of the map's Areas button are loaded per selected topic (refreshRegions below).
        // Module scripts run after the classic script below, so tell it the map is ready now.
        window.dispatchEvent(new Event('trend:map-ready'));
    </script>

    <script>
        const API_BASE = window.location.protocol.startsWith('http') ? '' : 'http://127.0.0.1:8000';

        // Map layers: satellite image (bottom), the last result, the stations of a drawn box (top).
        window.refreshMapLayers = function () {
            if (!window.trendMap) return;
            const layers = [];
            if (window.satelliteLayer) layers.push(window.satelliteLayer);
            layers.push(...(window.lastMapLayers || []));
            // While one station of the box is picked, its (faded) box dots stay for context.
            const stationPicked = Boolean(window.areaFocusPoint && window.areaFocusPoint());
            if (window.boxStationsLayer && (!window.boxPreviewHidden || stationPicked)) layers.push(window.boxStationsLayer);
            window.trendMap.setResultData(layers);
        };

        let allTopics = [];
        let topicDetails = {};
        const selectedTopics = {};

        // Regions with enough stations to evaluate an area for the selected topics (the
        // map's Areas button). Reloaded on every topic change; only the newest answer is
        // applied, so a slow reply for an earlier selection cannot overwrite it.
        let regionsRequest = 0;
        // Every region the server listed so far (id -> region), with its preloaded variables.
        const regionsById = new Map();

        // {variable: stations} of the selected region, or null for a point / unknown region.
        function selectedRegionVariables() {
            const area = window.getSelectedArea && window.getSelectedArea();
            const p = (area && area.properties) || {};
            if (p.shape !== 'region') return null;
            const region = regionsById.get(String(p.regionId));
            return region && region.variables ? region.variables : null;
        }

        // A region marks the variables without data there (counted in advance by
        // region_variables.py), so nobody has to run an analysis to find out.
        window.addEventListener('trend:area', () => {
            if (allTopics.length) renderTopics(document.getElementById('topic-search').value);
        });
        function refreshRegions() {
            // The map is mounted by a module script, which runs after this one.
            if (!window.trendMap) return;
            const request = ++regionsRequest;
            const topics = Object.keys(selectedTopics).filter((topic) => selectedTopics[topic]);
            const query = topics.length ? `?topics=${encodeURIComponent(topics.join(','))}` : '';
            fetch(`${API_BASE}/api/regions${query}`)
                .then((r) => (r.ok ? r.json() : { regions: [] }))
                .then((d) => {
                    for (const region of d.regions || []) regionsById.set(region.id, region);
                    if (request === regionsRequest) window.trendMap.setRegions(d.regions || []);
                    if (allTopics.length) renderTopics(document.getElementById('topic-search').value);
                })
                .catch(() => {});
        }
        refreshRegions();
        window.addEventListener('trend:map-ready', refreshRegions);

        let allTools = [];
        const selectedTools = {};

        const applyBtn = document.getElementById('apply');
        const timeintervallStartInput = document.getElementById('timeintervall-start');
        const timeintervallEndInput = document.getElementById('timeintervall-end');
        const timeintervallHint = document.getElementById('timeintervall-hint');
        const intervalValueInput = document.getElementById('interval-value');
        const intervalUnitSelect = document.getElementById('interval-unit');
        const intervalHint = document.getElementById('interval-hint');

        const topicsDropdown = document.getElementById('topics-dropdown');

        function sanitizeDateInput(inputElement) {
            const cleaned = inputElement.value.replace(/[^0-9.]/g, '');
            if (inputElement.value !== cleaned) {
                inputElement.value = cleaned;
            }
        }

        function parseDdMmYyyy(value) {
            const trimmed = value.trim();
            if (!/^\d{2}\.\d{2}\.\d{4}$/.test(trimmed)) {
                return null;
            }
            const [dayStr, monthStr, yearStr] = trimmed.split('.');
            const day = Number(dayStr);
            const month = Number(monthStr);
            const year = Number(yearStr);
            if (month < 1 || month > 12 || year < 1) {
                return null;
            }
            const dateObj = new Date(year, month - 1, day);
            if (
                dateObj.getFullYear() !== year ||
                dateObj.getMonth() !== month - 1 ||
                dateObj.getDate() !== day
            ) {
                return null;
            }
            return dateObj;
        }

        function isIntervalValueValid() {
            const raw = intervalValueInput.value.trim();
            if (raw.length === 0) {
                return false;
            }
            const parsed = Number(raw);
            return Number.isFinite(parsed) && parsed > 0;
        }

        function updateApplyButtonState() {
            sanitizeDateInput(timeintervallStartInput);
            sanitizeDateInput(timeintervallEndInput);

            const hasSelectedTopic = Object.values(selectedTopics).some(Boolean);
            const startRaw = timeintervallStartInput.value.trim();
            const endRaw = timeintervallEndInput.value.trim();
            const startDate = parseDdMmYyyy(startRaw);
            const endDate = parseDdMmYyyy(endRaw);
            const datesOrderValid = startDate && endDate ? endDate >= startDate : true;
            const startValid = Boolean(startDate);
            const endValid = Boolean(endDate) && datesOrderValid;
            const validInterval = isIntervalValueValid();
            const currentArea = window.getSelectedArea ? window.getSelectedArea() : null;
            // A drawn box is evaluated up to 1,000,000 km² (area_analysis.MAX_BOX_KM2).
            const boxTooLarge = Boolean(currentArea && currentArea.properties
                && currentArea.properties.shape === 'box' && currentArea.properties.areaKm2 > 1e6);
            const hasArea = Boolean(currentArea) && !boxTooLarge;

            timeintervallStartInput.classList.toggle('invalid', startRaw.length > 0 && !startValid);
            timeintervallEndInput.classList.toggle('invalid', endRaw.length > 0 && !endValid);
            timeintervallHint.classList.toggle(
                'visible',
                (startRaw.length > 0 && !startValid) || (endRaw.length > 0 && !endValid)
            );

            const rawInterval = intervalValueInput.value.trim();
            intervalValueInput.classList.toggle('invalid', rawInterval.length > 0 && !validInterval);
            intervalHint.classList.toggle('visible', rawInterval.length > 0 && !validInterval);

            applyBtn.disabled = !(
                hasSelectedTopic &&
                startValid &&
                endValid &&
                validInterval &&
                hasArea
            );
            // Say what is still missing instead of a silently disabled button.
            const missing = [];
            if (boxTooLarge) missing.push('draw a smaller box (at most 1,000,000 km²)');
            else if (!hasArea) missing.push('pick a point, draw a box or choose a region (Areas) on the map');
            if (!hasSelectedTopic) missing.push('choose a variable');
            if (!startValid || !endValid) missing.push('enter a valid time range');
            if (!validInterval) missing.push('enter an interval length');
            const status = document.getElementById('apply-status');
            if (status) {
                const count = Object.values(selectedTopics).filter(Boolean).length;
                status.innerHTML = missing.length
                    ? `<strong>To start:</strong> ${missing.map(escapeText).join(', ')}.`
                    : `${count} variable${count === 1 ? '' : 's'} at ${escapeText(describeArea(window.getSelectedArea()))}`;
            }
            renderSelectedChips();
            window.dispatchEvent(new Event('trend:inputs'));
            const counter = document.getElementById('topics-count');
            if (counter) {
                const count = Object.values(selectedTopics).filter(Boolean).length;
                counter.textContent = count ? `${count} selected` : '';
            }
        }

        function describeArea(area) {
            if (!area) return '';
            const p = area.properties || {};
            if (p.shape === 'region') return p.name || 'the region';
            if (p.shape === 'box') return `the drawn box (${Math.round(p.areaKm2 || 0).toLocaleString('en-US')} km²)`;
            if (p.placeName) return p.placeName;
            const c = area.geometry && area.geometry.coordinates;
            return Array.isArray(c) ? `${Number(c[1]).toFixed(2)}°, ${Number(c[0]).toFixed(2)}°` : 'the point';
        }
        window.addEventListener('trend:area', () => updateApplyButtonState());

        // Puts the dots in while typing: "01012020" -> "01.01.2020", "1.1." -> "01.01.".
        // `sizes` are the digit counts of the parts (day, month, year).
        function formatDateTyping(input, event, sizes = [2, 2, 4]) {
            const deleting = Boolean(event && event.inputType && event.inputType.startsWith('delete'));
            const raw = input.value;
            const caret = input.selectionStart ?? raw.length;
            const atEnd = caret >= raw.length;
            const digitsBeforeCaret = raw.slice(0, caret).replace(/\D/g, '').length;

            const parts = [''];
            for (const ch of raw) {
                const k = parts.length - 1;
                if (/\d/.test(ch)) {
                    if (parts[k].length >= sizes[k]) {
                        if (k + 1 >= sizes.length) continue;
                        parts.push('');
                    }
                    parts[parts.length - 1] += ch;
                } else if (ch === '.' && parts[k].length > 0 && k + 1 < sizes.length) {
                    // A dot after a single digit means "1." = "01.".
                    if (parts[k].length < sizes[k]) parts[k] = parts[k].padStart(sizes[k], '0');
                    parts.push('');
                }
            }
            let formatted = parts.join('.');
            const last = parts.length - 1;
            if (!deleting && last + 1 < sizes.length && parts[last].length === sizes[last]) formatted += '.';
            if (formatted === raw) return;
            input.value = formatted;
            if (atEnd) {
                input.setSelectionRange(formatted.length, formatted.length);
            } else {
                let seen = 0;
                let pos = 0;
                while (pos < formatted.length && seen < digitsBeforeCaret) {
                    if (/\d/.test(formatted[pos])) seen += 1;
                    pos += 1;
                }
                input.setSelectionRange(pos, pos);
            }
        }
        window.formatDateTyping = formatDateTyping;

        for (const input of [timeintervallStartInput, timeintervallEndInput]) {
            input.setAttribute('inputmode', 'decimal');
            input.addEventListener('input', (event) => {
                formatDateTyping(input, event);
                updateApplyButtonState();
            });
        }
        intervalValueInput.addEventListener('input', updateApplyButtonState);
        intervalUnitSelect.addEventListener('change', updateApplyButtonState);

        const GROUP_ORDER = ['Temperature', 'Precipitation', 'Snow', 'Wind', 'Humidity, clouds & sun', 'Pressure', 'Soil', 'Ice', 'Marine', 'Other'];
        const KIND_BADGE = { model: ['model', 'ERA5 reanalysis: a weather model run with past observations; a value for every place since 1940'], satellite: ['satellite', 'Satellite measurement'], marine: ['ships & buoys', 'Reports of ships and buoys near the point; slow for long time ranges'] };

        function topicLabel(topic) {
            const d = topicDetails[topic];
            return d && d.label ? d.label : topic;
        }

        // A result key is a topic key or "<topic key> · <series>" (e.g. "temperature · maximum (TMAX)").
        function seriesLabel(key) {
            const [base, ...rest] = String(key).split(' · ');
            return [topicLabel(base), ...rest].join(' · ');
        }

        // One line per requested series above the result cards: what has data, what failed and why.
        function availabilityHtml(entries, opts) {
            const isNumber = (v) => typeof v === 'number' && Number.isFinite(v);
            const items = entries.map(([key, info]) => {
                const n = (Array.isArray(info.values) ? info.values : []).filter(isNumber).length;
                if (n) return `<li class="avail-ok"><span class="avail-mark" aria-hidden="true">✓</span>${escapeText(seriesLabel(key))} <span class="avail-sub">${n} values</span></li>`;
                const why = String(info.error || 'No values in the selected time range.').split(/(?<=\.)\s/)[0];
                return `<li class="avail-bad" title="${escapeText(info.error || '')}"><span class="avail-mark" aria-hidden="true">✗</span>${escapeText(seriesLabel(key))} <span class="avail-sub">${escapeText(why)}</span></li>`;
            });
            for (const key of opts.pending || []) {
                items.push(opts.failed
                    ? `<li class="avail-bad"><span class="avail-mark" aria-hidden="true">✗</span>${escapeText(seriesLabel(key))} <span class="avail-sub">${escapeText(opts.failed)}</span></li>`
                    : `<li class="avail-wait"><span class="avail-mark" aria-hidden="true">…</span>${escapeText(seriesLabel(key))} <span class="avail-sub">loading</span></li>`);
            }
            return `<ul class="avail-list" aria-label="Data availability">${items.join('')}</ul>`;
        }

        // Open / closed state of the topic categories the user toggled (group -> open).
        const openTopicGroups = new Map();

        function renderTopics(filterText = '') {
            const listContainer = document.getElementById('topics-list');
            listContainer.innerHTML = '';

            const normalizedFilter = filterText.trim().toLowerCase();
            const matchingTopics = allTopics.filter((topic) => {
                const d = topicDetails[topic] || {};
                return [topic, d.label, d.description, d.group].some((text) => String(text || '').toLowerCase().includes(normalizedFilter));
            });

            if (matchingTopics.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-message';
                empty.textContent = 'No matching variables found.';
                listContainer.appendChild(empty);
                return;
            }

            const groups = new Map();
            for (const topic of matchingTopics) {
                const group = (topicDetails[topic] && topicDetails[topic].group) || 'Other';
                if (!groups.has(group)) groups.set(group, []);
                groups.get(group).push(topic);
            }
            const order = [...groups.keys()].sort((a, b) => GROUP_ORDER.indexOf(a) - GROUP_ORDER.indexOf(b));
            const searching = normalizedFilter.length > 0;
            const areaVars = selectedRegionVariables();

            const tools = document.createElement('div');
            tools.className = 'topics-tools';
            tools.innerHTML = '<button type="button" data-groups="open">Expand all</button><button type="button" data-groups="close">Collapse all</button>';
            tools.addEventListener('click', (event) => {
                const button = event.target.closest('button[data-groups]');
                if (!button) return;
                const open = button.dataset.groups === 'open';
                listContainer.querySelectorAll('details.topic-group').forEach((details) => { details.open = open; });
            });
            listContainer.appendChild(tools);

            for (const group of order) {
                const topics = groups.get(group);
                // Closed by default; open while searching, when the user opened it, or when it holds a selected topic.
                const hasSelected = topics.some((t) => selectedTopics[t]);
                const details = document.createElement('details');
                details.className = 'topic-group';
                details.open = searching || (openTopicGroups.has(group) ? openTopicGroups.get(group) : hasSelected);
                details.addEventListener('toggle', () => {
                    if (!searching) openTopicGroups.set(group, details.open);
                });

                const summary = document.createElement('summary');
                const chevron = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                chevron.setAttribute('class', 'topic-group-chevron');
                chevron.setAttribute('viewBox', '0 0 12 12');
                chevron.setAttribute('aria-hidden', 'true');
                chevron.innerHTML = '<path d="M4 2.5 7.5 6 4 9.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';
                const name = document.createElement('span');
                name.textContent = group;
                const count = document.createElement('span');
                count.className = 'topic-group-count';
                summary.append(chevron, name, count);
                details.appendChild(summary);

                const items = document.createElement('div');
                items.className = 'topic-group-items';
                details.appendChild(items);

                const updateCount = () => {
                    const selected = topics.filter((t) => selectedTopics[t]).length;
                    count.innerHTML = selected ? `<span class="sel">${selected} selected</span> · ${topics.length}` : String(topics.length);
                };
                updateCount();

                // Station data first, then model / satellite / marine; daily before hourly.
                const FEATURED = ['temperature', 'precipitation', 'snowfall', 'snow_depth', 'wind_speed'];
                const rank = (t) => {
                    const d = topicDetails[t] || {};
                    const featured = FEATURED.includes(t) ? 0 : 1;
                    const coarse = /_(monthly|annual)$/.test(t) ? 1 : 0;
                    return featured * 100 + (d.kind === 'station' ? 0 : d.kind === 'model' ? 1 : 2) * 10 + (d.hourly ? 2 : coarse);
                };
                for (const topic of topics.sort((a, b) => rank(a) - rank(b) || topicLabel(a).localeCompare(topicLabel(b)))) {
                    const d = topicDetails[topic] || {};
                    const label = document.createElement('label');
                    label.className = 'topic-item';
                    label.title = [d.description, d.sources && d.sources.length ? `Sources: ${d.sources.join(', ')}` : '', `Key: ${topic}`].filter(Boolean).join('\n');

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = Boolean(selectedTopics[topic]);
                    checkbox.addEventListener('change', (event) => {
                        selectedTopics[topic] = event.target.checked;
                        updateCount();
                        updateApplyButtonState();
                        refreshRegions();
                    });

                    const text = document.createElement('span');
                    text.className = 'topic-text';
                    const topicName = document.createElement('span');
                    topicName.className = 'topic-name';
                    topicName.textContent = topicLabel(topic).replace(/ \((ERA5 model|VIIRS satellite)\)$/, '');
                    if (areaVars && !(topic in areaVars)) {
                        const x = document.createElement('span');
                        x.className = 'no-area-data';
                        x.textContent = '✕';
                        x.title = 'No data for this variable in the selected area';
                        x.setAttribute('aria-label', 'No data in the selected area');
                        topicName.appendChild(x);
                    }
                    const badge = KIND_BADGE[d.kind] || (d.hourly ? ['hourly', 'Hourly reports: large downloads for long time ranges'] : null);
                    if (badge) {
                        const b = document.createElement('span');
                        b.className = `topic-kind ${d.kind in KIND_BADGE ? d.kind : 'hourly'}`;
                        b.textContent = badge[0];
                        b.title = badge[1];
                        topicName.appendChild(b);
                    }
                    const meta = document.createElement('span');
                    meta.className = 'topic-meta';
                    meta.textContent = d.sources && d.sources.length ? d.sources.join(' · ') : topic;
                    text.append(topicName, meta);

                    label.appendChild(checkbox);
                    label.appendChild(text);
                    items.appendChild(label);
                }
                listContainer.appendChild(details);
            }
        }

        async function loadTopics() {
            const listContainer = document.getElementById('topics-list');
            try {
                const response = await fetch(`${API_BASE}/api/topics`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                topicDetails = data.details || {};
                allTopics = [...data.topics].sort((a, b) => a.localeCompare(b));

                for (const topic of allTopics) {
                    if (!(topic in selectedTopics)) {
                        selectedTopics[topic] = false;
                    }
                }
                renderTopics(document.getElementById('topic-search').value);
                updateApplyButtonState();
            } catch (error) {
                listContainer.innerHTML =
                    '<div class="empty-message">Cannot reach Python server at http://127.0.0.1:8000. Make sure "python app.py" is running.</div>';
            }
        }

        // The analysis tools are chosen per time frame in the plot panel
        // (static/plots/plots.js). The task output below always runs all of them.
        async function loadTools() {
            try {
                const response = await fetch(`${API_BASE}/api/tools`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                allTools = [...data.tools].sort((a, b) => a.localeCompare(b));
                for (const tool of allTools) {
                    selectedTools[tool] = true;
                }
            } catch (error) {
                allTools = [];
            }
        }

        // Selected variables as chips above the list; ✕ deselects.
        function renderSelectedChips() {
            const box = document.getElementById('selected-chips');
            if (!box) return;
            const chosen = Object.keys(selectedTopics).filter((t) => selectedTopics[t]);
            box.innerHTML = chosen.map((t) => `<span class="sel-chip">${escapeText(topicLabel(t).replace(/ \((ERA5 model|VIIRS satellite)\)$/, ''))}`
                + `<button type="button" data-unselect="${escapeText(t)}" aria-label="Remove ${escapeText(topicLabel(t))}">✕</button></span>`).join('');
            box.hidden = chosen.length === 0;
        }
        document.getElementById('selected-chips').addEventListener('click', (event) => {
            const button = event.target.closest('[data-unselect]');
            if (!button) return;
            selectedTopics[button.dataset.unselect] = false;
            renderTopics(document.getElementById('topic-search').value);
            updateApplyButtonState();
            refreshRegions();
        });

        // Quick time ranges: the last n complete years, or from a year to the last complete year.
        (function () {
            const presets = document.querySelector('.range-presets');
            if (!presets) return;
            const lastYear = new Date().getFullYear() - 1;
            const rangeOf = (b) => [b.dataset.years ? lastYear - Number(b.dataset.years) + 1 : Number(b.dataset.since), lastYear];
            presets.addEventListener('click', (event) => {
                const button = event.target.closest('button');

            // Highlight the preset the dates match.

                for (const button of presets.querySelectorAll('button')) {

                    button.setAttribute('aria-pressed', String(match));

        // Sensible start: the last ten complete years, daily values, temperature selected.
        (function setDefaults() {
            const lastYear = new Date().getFullYear() - 1;
            if (!timeintervallStartInput.value) timeintervallStartInput.value = `01.01.${lastYear - 9}`;
            if (!timeintervallEndInput.value) timeintervallEndInput.value = `31.12.${lastYear}`;
            if (!intervalValueInput.value) intervalValueInput.value = '1';
