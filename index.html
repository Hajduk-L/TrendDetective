        })();
        loadTopics();
        refreshRegions();

        document.getElementById('topic-search').addEventListener('input', async (event) => {
            if (!topicsDropdown.classList.contains('open')) {
                topicsDropdown.classList.add('open');
            }
            if (allTopics.length === 0) {
                await loadTopics();
            } else {
                renderTopics(event.target.value);
            }
        });

        // Rounds a raw step to 1, 2, 2.5 or 5 times a power of ten for readable ticks.
        function niceStep(rawStep) {
            const power = Math.pow(10, Math.floor(Math.log10(rawStep)));
            const fraction = rawStep / power;
            const nice = fraction <= 1 ? 1 : fraction <= 2 ? 2 : fraction <= 2.5 ? 2.5 : fraction <= 5 ? 5 : 10;
            return nice * power;
        }

        function formatTick(value, step) {
            const decimals = Math.max(0, -Math.floor(Math.log10(step)) + (step % 1 === 0 ? 0 : 1));
            return value.toFixed(Math.min(decimals, 3));
        }

        // Time-series chart: one point per interval (x = interval start date,
        // y = mean value), with axes, gridlines, unit, tooltips and an optional
        // dashed linear trend. It is drawn at the host's real pixel width (1 SVG
        // unit = 1 CSS px), so text never scales and tick counts fit the space.
        function buildSvgChart(values, trendLine, labels, unit, pixelWidth) {
            if (!Array.isArray(values) || values.length === 0) {
                return '<div class="chart-empty">No numeric values in the selected time range.</div>';
            }
            const num = (v) => (typeof v === 'number' && Number.isFinite(v) ? v : null);
            const series = values.map(num);
            if (series.every((v) => v === null)) {
                return '<div class="chart-empty">No numeric values in the selected time range.</div>';
            }
            const n = series.length;
            const width = Math.max(240, Math.round(pixelWidth || 640));
            const height = 226;
            const right = 14;
            const top = 30;
            const bottom = 40;
            const charW = 6.4; // approx. width of one 11px label character (digits/dots)
            const unitText = unit ? ` ${unit}` : '';

            const trend = Array.isArray(trendLine) && trendLine.length === n ? trendLine.map(num) : null;
            const finite = [...series, ...(trend || [])].filter((v) => v !== null);
            let minV = Math.min(...finite);
            let maxV = Math.max(...finite);
            if (maxV - minV < 1e-9) {
                const pad = Math.abs(minV) > 1 ? Math.abs(minV) * 0.1 : 1;
                minV -= pad;
                maxV += pad;
            }
            const step = niceStep((maxV - minV) / 4);
            const yStart = Math.floor(minV / step) * step;
            const yEnd = Math.ceil(maxV / step) * step;
            const yTicks = [];
            for (let k = 0; yStart + k * step <= yEnd + step / 2; k++) {
                yTicks.push(yStart + k * step);
            }
            const yLabels = yTicks.map((v) => formatTick(v, step));
            const left = Math.ceil(Math.max(...yLabels.map((t) => t.length)) * charW) + 14;
            const plotW = width - left - right;
            const plotH = height - top - bottom;

            const toX = (i) => n <= 1 ? left + plotW / 2 : left + (i / (n - 1)) * plotW;
            const toY = (v) => top + plotH - ((v - yStart) / (yEnd - yStart)) * plotH;

            let svg = '';
            yTicks.forEach((v, k) => {
                const y = toY(v).toFixed(1);
                svg += `<line x1="${left}" x2="${width - right}" y1="${y}" y2="${y}" stroke="#eef2f7" />`;
                svg += `<text x="${left - 6}" y="${y}" text-anchor="end" dominant-baseline="middle">${yLabels[k]}</text>`;
            });
            if (unit) {
                svg += `<text x="4" y="${top - 10}" text-anchor="start">${escapeText(unit)}</text>`;
            }
            svg += `<line x1="${left}" x2="${left}" y1="${top}" y2="${top + plotH}" stroke="#94a3b8" />`;
            svg += `<line x1="${left}" x2="${width - right}" y1="${top + plotH}" y2="${top + plotH}" stroke="#94a3b8" />`;

            // x ticks: evenly spaced interval labels including the first and last;
            // start with as many as could fit and use fewer until none overlap
            const safeLabels = Array.isArray(labels) && labels.length === n ? labels.map(String) : series.map((_, i) => `#${i + 1}`);
            const gap = 10;
            const tickBox = (i) => {
                const x = toX(i);
                const w = safeLabels[i].length * charW;
                if (n > 1 && x - w / 2 < 2) return { i, x, tx: Math.max(2, x - 4), anchor: 'start', from: Math.max(2, x - 4), to: Math.max(2, x - 4) + w };
                if (n > 1 && x + w / 2 > width - 2) return { i, x, tx: Math.min(width - 2, x + 4), anchor: 'end', from: Math.min(width - 2, x + 4) - w, to: Math.min(width - 2, x + 4) };
                return { i, x, tx: x, anchor: 'middle', from: x - w / 2, to: x + w / 2 };
            };
            const maxLabelW = Math.max(...safeLabels.map((t) => t.length)) * charW + gap;
            let ticks = [tickBox(0)];
            for (let k = Math.min(n, Math.floor(plotW / maxLabelW) + 1); k >= 2; k--) {
                const indexes = [...new Set(Array.from({ length: k }, (_, j) => Math.round((j * (n - 1)) / (k - 1))))];
                const boxes = indexes.map(tickBox);
                if (boxes.every((box, j) => j === 0 || box.from >= boxes[j - 1].to + gap)) {
                    ticks = boxes;
                    break;
                }
            }
            for (const t of ticks) {
                svg += `<line x1="${t.x.toFixed(1)}" x2="${t.x.toFixed(1)}" y1="${top + plotH}" y2="${top + plotH + 4}" stroke="#94a3b8" />`;
                svg += `<text x="${t.tx.toFixed(1)}" y="${top + plotH + 16}" text-anchor="${t.anchor}">${escapeText(safeLabels[t.i])}</text>`;
            }
            svg += `<text x="${(left + plotW / 2).toFixed(1)}" y="${height - 6}" text-anchor="middle">interval start date</text>`;

            // series (gaps where a value is missing)
            const polyline = (vals, attrs) => {
                let segment = [];
                let out = '';
                const flush = () => {
                    if (segment.length > 1) out += `<polyline fill="none" ${attrs} points="${segment.join(' ')}" />`;
                    segment = [];
                };
                vals.forEach((v, i) => {
                    if (v === null) { flush(); return; }
                    segment.push(`${toX(i).toFixed(1)},${toY(v).toFixed(1)}`);
                });
                flush();
                return out;
            };
            svg += polyline(series, 'stroke="#2563eb" stroke-width="2"');
            if (trend) {
                svg += polyline(trend, 'stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"');
            }
            // smaller markers when points would touch (e.g. daily intervals)
            const dense = n > 1 && plotW / (n - 1) < 9;
            series.forEach((v, i) => {
                if (v === null) return;
                svg += `<circle cx="${toX(i).toFixed(1)}" cy="${toY(v).toFixed(1)}" r="${dense ? 1.6 : 3.5}" fill="#1d4ed8"${dense ? '' : ' stroke="#ffffff" stroke-width="1"'}>`
                    + `<title>${escapeText(safeLabels[i])}: ${v}${escapeText(unitText)}</title></circle>`;
            });

            return `<svg class="chart-svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img">${svg}</svg>`;
        }

        // Draws the chart at the host's current width and redraws it when the
        // card is resized (window resize, grid reflow).
        const chartResizeObserver = typeof ResizeObserver === 'function'
            ? new ResizeObserver((entries) => {
                for (const entry of entries) drawChartInto(entry.target);
            })
            : null;

        function drawChartInto(host) {
            const data = host._chartData;
            if (!data) return;
            const w = Math.floor(host.clientWidth);
            if (!w || w === host._chartWidth) return;
            host._chartWidth = w;
            host.innerHTML = buildSvgChart(data.values, data.trendLine, data.labels, data.unit, w);
        }

        function buildChartLegend(info, hasTrend) {
            const variables = Array.isArray(info.variables) && info.variables.length
                ? ` of ${info.variables.map(escapeText).join(', ')}`
                : '';
            let html = `<div class="chart-legend"><span><span style="color:#1d4ed8;">●</span> mean per interval${variables}</span>`;
            if (hasTrend) {
                html += '<span><span style="color:#dc2626;">╌╌</span> linear trend</span>';
            }
            return html + '</div>';
        }

        // opts (progressive 'Apply'): partial = more topics are coming (skip the coverage lookups
        // until the end), pending = topics not loaded yet, failed = why they will not load.
        // The three most notable events of a card; a click shows the event in the plot panel.
        function eventChipsHtml(info, topic) {
            const list = Array.isArray(info.events) ? info.events.slice(0, 3) : [];
            if (!list.length) return '';
            const fmtDate = (iso) => new Date(`${iso}T12:00:00Z`).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
            return `<div class="event-chips">${list.map((ev) => {
                const cold = /low|cold/.test(ev.kind);
                const value = ev.end ? `${ev.days} days` : `${ev.value}${info.unit ? ' ' + info.unit : ''}`;
                return `<button type="button" class="event-chip${cold ? ' cold' : ''}" data-topic="${escapeText(topic)}" data-date="${escapeText(ev.peak_date || ev.date)}" title="${escapeText(ev.description)}">${escapeText(ev.title)} · ${escapeText(fmtDate(ev.date))} · ${escapeText(value)}</button>`;
            }).join('')}</div>`;
        }

        document.getElementById('visualization-container').addEventListener('click', (event) => {
            const chip = event.target.closest('.event-chip');
            if (!chip || !window.TrendPlots) return;
            window.TrendPlots.focusExample(chip.dataset.date, null, chip.dataset.topic);
            document.getElementById('plot-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        // Scrolls an opened card into view once it has its new size; nothing moves if it already fits.
        // A card taller than the window is only scrolled when its top is not near the top already.
        window.revealOpened = function (el) {
            if (!el) return;
            requestAnimationFrame(() => {
                if (!el.isConnected || !el.getClientRects().length) return;
                const r = el.getBoundingClientRect();
                const vh = window.innerHeight || document.documentElement.clientHeight;
                if (r.top >= 0 && r.bottom <= vh) return;
                const tall = r.height > vh;
                if (tall && r.top >= 0 && r.top < vh * 0.3) return;
                const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: tall ? 'start' : 'nearest' });
            });
        };
        // The "Raw output" card (the toggle event only comes from the user here; the card starts closed).
        document.querySelector('details.task-output').addEventListener('toggle', (event) => {
            if (event.target.open) window.revealOpened(event.target);
        });

        function renderVisualization(visualization, opts = {}) {
            const container = document.getElementById('visualization-container');
            if (!visualization || !visualization.topics) {
                container.innerHTML = '<div class="empty-message">No visualization data available.</div>';
                return;
            }

            if (window.trendMap && Array.isArray(visualization.map_layers)) {
                window.lastMapLayers = visualization.map_layers;
                window.boxPreviewHidden = true; // the result's station dots replace the box preview
                window.refreshMapLayers();
                fitMapToSelectionAndStations(visualization.map_layers);
                if (window.updateMapLegend) window.updateMapLegend(visualization.map_layers);
            }

            const entries = Object.entries(visualization.topics);
            if (entries.length === 0) {
                container.innerHTML = '<div class="empty-message">No variables selected.</div>';
                return;
            }

            if (chartResizeObserver) chartResizeObserver.disconnect();
            container.innerHTML = availabilityHtml(entries, opts);
            const chartHosts = [];
            for (const [topic, info] of entries) {
                const card = document.createElement('div');
                card.className = 'topic-viz-card';
                const hasAnyValue = (Array.isArray(info.values) ? info.values : []).some((v) => typeof v === 'number' && Number.isFinite(v));
                if (!hasAnyValue) card.classList.add('is-failed');

                const tools = info.tools || {};
                const lr = tools['Linear Regression'];
                const tt = tools['t-Test'];
                const mk = tools['Mann-Kendall'];
                const values = Array.isArray(info.values) ? info.values : [];
                const show = (v) => (v === null || v === undefined || v === '' ? '–' : escapeText(String(v)));
                const badge = (text, title) => `<span class="metric-badge"${title ? ` title="${escapeText(title)}"` : ''}>${text}</span>`;
                const unavailable = (name, result) => `<span class="metric-badge metric-badge-muted" title="${escapeText(result.error || '')}">${name}: ${escapeText(result.error || 'not available')}</span>`;

                const sen = tools["Sen's Slope"];
                const cp = tools['Change Point'];
                const unitText = info.unit ? ' ' + escapeText(info.unit) : '';
                let badgesHtml = badge(`Mean: ${show(info.mean)}${info.mean != null ? unitText : ''}`);
                badgesHtml += badge(`Intervals: ${values.length}`);
                // Headline: the trend per decade in words, with its significance.
                const trend = lr && lr.available !== false && lr.slope_per_decade != null ? lr
                    : sen && sen.available !== false && sen.slope_per_decade != null ? sen : null;
                let headline = '';
                if (trend) {
                    const v = Number(trend.slope_per_decade);
                    const p = Number(trend.p_value);
                    const pText = Number.isFinite(p) ? (p < 0.001 ? 'p < 0.001' : `p = ${p.toFixed(3)}`) : '';
                    headline = `<div class="trend-headline">Trend: <strong>${v > 0 ? '+' : v < 0 ? '−' : ''}${escapeText(Math.abs(v).toPrecision(2))}${unitText} per decade</strong>`
                        + `<span class="sig ${trend.significant ? 'yes' : 'no'}" title="${escapeText(trend.effective_n ? `About ${Math.round(trend.effective_n)} independent values after accounting for autocorrelation` : 'Significance at the 5 % level')}">(${pText ? `${pText}, ` : ''}${trend.significant ? 'significant at 5 %' : 'not significant'})</span></div>`;
                }
                if (lr && lr.available !== false) {
                    badgesHtml += badge(`Slope: ${show(lr.slope)}${info.unit ? ' ' + escapeText(info.unit) + ' per interval' : ' per interval'}`, `Value of the trend line at the first interval: ${lr.intercept}`);
                }
                if (sen && sen.available !== false) {
                    badgesHtml += badge(`Sen's slope: ${show(sen.slope_per_decade)}${unitText}/decade${sen.significant ? ' (significant)' : ''}`, 'Median of all pairwise slopes; robust to single extremes');
                }
                if (cp && cp.available !== false) {
                    badgesHtml += badge(`Change point: ${show(cp.date || cp.x_after)}${cp.significant ? ` (shift ${cp.shift > 0 ? '+' : ''}${show(cp.shift)}${unitText})` : ' (not significant)'}`, `Pettitt test, p = ${cp.p_value}`);
                }
                if (tt) {
                    if (tt.available === false) {
                        badgesHtml += unavailable('t-Test', tt);
                    } else {
                        badgesHtml += badge(`t-stat: ${show(tt.t_statistic)}`, 't-Test: first half vs. second half of the intervals');
                        badgesHtml += badge(`t-Test p: ${show(tt.p_value)}${tt.significant ? ' (significant)' : ''}`);
                    }
                }
                if (mk) {
                    if (mk.available === false) {
                        badgesHtml += unavailable('Mann-Kendall', mk);
                    } else {
                        badgesHtml += badge(`Mann-Kendall: ${show(mk.trend)}, p ${show(mk.p_value)}`, `tau ${mk.tau ?? '–'}, z ${mk.z_statistic ?? '–'}, S ${mk.s_statistic ?? '–'}`);
                    }
                }

                const st = info.station;
                const stationHtml = st
                    ? `<div class="station-line">Station: ${escapeText(st.name || st.id || 'station')}`
                      + `${st.id ? ` (${escapeText(st.id)})` : ''}: ${Number(st.latitude).toFixed(4)}, ${Number(st.longitude).toFixed(4)}`
                      + ` · ${st.distance_km} km from the selected point`
                      + `${st.source ? ` · source: ${escapeText(st.source)}` : ''}</div>`
                    : info.region && !info.error
                    ?`<div class="station-line">Area mean of ${info.station_count ?? 'the'} stations in ${escapeText(info.region.name)}`
                      + (info.sources && Object.keys(info.sources).length
                          ? ` (${Object.entries(info.sources).map(([name, n]) => `${escapeText(name)} ${n}`).join(', ')})`
                          : '')
                      + (info.duplicates_removed ? ` · ${info.duplicates_removed} duplicate station(s) from other databases removed` : '')
                      + ' · each dot on the map is one station, coloured by its own trend</div>'
                    : '';
                const trendLine = lr ? lr.trend_line : null;
                const hasValues = values.some((v) => typeof v === 'number' && Number.isFinite(v));
                const coords = Array.isArray(info.coordinates) ? info.coordinates : null;
                card.innerHTML = `
                    <div class="topic-viz-header">
                        <span>${escapeText(seriesLabel(topic))}</span>
                        ${coords ? `<span style="font-size:0.78rem;color:#64748b;white-space:nowrap;">[${coords[0]}, ${coords[1]}]</span>` : ''}
                    </div>
                    ${stationHtml}
                    ${info.error ? `<div class="topic-error">Error: ${escapeText(info.error)}</div>` : ''}
                    ${headline}
                    <div class="badge-row">${badgesHtml}</div>
                    ${eventChipsHtml(info, topic)}
                    <div class="chart-host"></div>
                    ${hasValues ? buildChartLegend(info, Array.isArray(trendLine)) : ''}
                `;
                container.appendChild(card);
                const host = card.querySelector('.chart-host');
                host._chartData = { values, trendLine, labels: info.labels, unit: info.unit };
                if (!hasValues) {
                    host.innerHTML = buildSvgChart([], null, [], null);
                    if (!opts.partial) loadCoverage(card, topic);
                } else {
                    chartHosts.push(host);
                }
            }
            for (const topic of opts.pending || []) {
                const card = document.createElement('div');
                card.className = 'topic-viz-card';
                card.innerHTML = `<div class="topic-viz-header"><span>${escapeText(seriesLabel(topic))}</span></div>`
                    + (opts.failed
                        ? `<div class="topic-error">Not loaded: ${escapeText(opts.failed)}</div>`
                        : '<div class="empty-message">Still loading…</div>');
                container.appendChild(card);
            }
            // Draw only after every card is in the grid, so each chart gets its final width.
            for (const host of chartHosts) {
                drawChartInto(host);
                if (chartResizeObserver) chartResizeObserver.observe(host);
            }
        }

        // ---- When do the stations here have data? (shown on cards without values) ----
        let lastRequestContext = null;

        function isoToDdMmYyyy(iso) {
            const [y, m, d] = String(iso).slice(0, 10).split('-');
            return `${d}.${m}.${y}`;
        }

        function yearOf(iso) {
            return Number(String(iso).slice(0, 4));
        }

        async function loadCoverage(card, topic) {
            const ctx = lastRequestContext;
            if (!ctx || !ctx.area) return;
            const box = document.createElement('div');
            box.className = 'coverage-box coverage-muted';
            box.textContent = 'Looking up when the stations here have data…';
            card.querySelector('.badge-row').before(box);
            try {
                const res = await fetch(`${API_BASE}/api/coverage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ area: ctx.area, topic, timeintervall: ctx.timeintervall }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
                renderCoverage(box, data);
            } catch (error) {
                box.textContent = `Could not look up when the stations here have data: ${error.message}`;
            }
        }

        // One bar per year: how many stations report the code; the requested time frame is shaded.
        function buildCoverageBars(code, requested, needed) {
            let first = code.years[0];
            let last = code.years[code.years.length - 1];
            const req = requested ? [yearOf(requested[0]), yearOf(requested[1])] : null;
            if (req) {
                first = Math.min(first, req[0]);
                last = Math.max(last, req[1]);
            }
            const span = last - first + 1;
            const maxCount = Math.max(needed, ...code.counts);
            const h = 30;
            const scale = (n) => (n / maxCount) * (h - 2);
            let svg = `<svg class="coverage-bars" viewBox="0 0 ${span} ${h}" preserveAspectRatio="none" role="img"`
                + ` aria-label="Stations reporting ${escapeText(code.code)} per year, ${first} to ${last}">`;
            if (req) {
                svg += `<rect class="request" x="${req[0] - first}" y="0" width="${req[1] - req[0] + 1}" height="${h}"><title>Your time frame: ${req[0]}–${req[1]}</title></rect>`;
            }
            const gap = span > 60 ? 0 : 0.15;
            code.years.forEach((year, i) => {
                const n = code.counts[i];
                if (!n) return;
                const bh = Math.max(scale(n), 1.5);
                svg += `<rect class="bar" x="${year - first + gap / 2}" y="${h - bh}" width="${1 - gap}" height="${bh}">`
                    + `<title>${year}: ${n} station${n === 1 ? '' : 's'}</title></rect>`;
            });
            if (needed > 1) {
                const y = h - scale(needed);
                svg += `<line class="need" x1="0" x2="${span}" y1="${y}" y2="${y}"><title>${needed} stations needed for an area</title></line>`;
            }
            svg += '</svg>';
            return svg + `<div class="coverage-axis"><span>${first}</span><span>${last}</span></div>`;
        }

        function renderCoverage(box, data) {
            box.classList.remove('coverage-muted');
            const where = data.scope === 'region'
                ? `in ${escapeText(data.place)}`
                : `within about ${data.radius_km} km`;
            if (!data.codes || data.codes.length === 0) {
                box.classList.add('coverage-muted');
                box.textContent = data.scope === 'region'
                    ? `No station in ${data.place} has ever reported this variable.`
                    : `No station within about ${data.radius_km} km has ever reported this variable. Try another place or variable.`;
                return;
            }
            const reqText = data.requested
                ? `${yearOf(data.requested[0])}–${yearOf(data.requested[1])}`
                : null;
            let html = `<div class="coverage-title">When is there data? Stations ${where}`
                + `${data.scope === 'region' ? ` (an area needs ${data.needed})` : ''}</div>`;
            data.codes.forEach((code, index) => {
                const label = code.name ? `${code.name} (${code.code})` : code.code;
                const inRange = code.in_range == null || !reqText
                    ? ''
                    : ` · <span class="muted">${code.in_range} cover ${reqText}</span>`;
                html += `<div class="coverage-code">`
                    + `<div class="coverage-code-head"><strong>${escapeText(label)}</strong>`
                    + `<span>${yearOf(code.first)}–${yearOf(code.last)} · ${code.station_count} station${code.station_count === 1 ? '' : 's'}${inRange}</span></div>`
                    + buildCoverageBars(code, data.requested, data.needed);
                if (index === 0 && code.stations.length) {
                    html += '<ul class="coverage-stations">' + code.stations.slice(0, 3).map((s) =>
                        `<li>${escapeText(s.name)}: ${yearOf(s.first)}–${yearOf(s.last)}`
                        + `${s.distance_km != null ? ` · ${s.distance_km} km` : ''}</li>`).join('') + '</ul>';
                }
                if (code.suggestion) {
                    const [a, b] = code.suggestion;
                    html += `<button type="button" class="coverage-use" data-start="${isoToDdMmYyyy(a)}" data-end="${isoToDdMmYyyy(b)}">`
                        + `Use ${isoToDdMmYyyy(a)} – ${isoToDdMmYyyy(b)}</button>`;
                }
                html += '</div>';
            });
            html += `<div class="coverage-legend"><span class="swatch" style="background:#0f766e"></span>stations reporting per year`
                + `${reqText ? ` &nbsp;<span class="swatch" style="background:#fed7aa"></span>your time frame` : ''}`
                + `${data.scope === 'region' ? ' &nbsp;┄ stations needed' : ''}</div>`;
            box.innerHTML = html;
            box.querySelectorAll('.coverage-use').forEach((button) => {
                button.addEventListener('click', () => {
                    timeintervallStartInput.value = button.dataset.start;
                    timeintervallEndInput.value = button.dataset.end;
                    updateApplyButtonState();
                    timeintervallStartInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                });
            });
        }

        // Zoom so the selected area and every measuring station are visible together;
        // a station can be tens of kilometres outside the selection.
        function fitMapToSelectionAndStations(mapLayers) {
            if (!window.trendMap || typeof window.trendMap.fitToBounds !== 'function') {
                return;
            }
            const points = [];
            // The drawn area, also while one of its stations is analysed alone (keeps the box in view).
            const getArea = window.getDrawnArea || window.getSelectedArea;
            const area = getArea ? getArea() : null;
            if (area && Array.isArray(area.bbox) && area.bbox.length === 4) {
                points.push([area.bbox[0], area.bbox[1]], [area.bbox[2], area.bbox[3]]);
            }
            for (const layer of mapLayers) {
                if (layer.id !== 'measuring-stations' || !layer.data) continue;
                for (const feature of layer.data.features || []) {
                    const c = feature.geometry && feature.geometry.coordinates;
                    if (Array.isArray(c) && c.length >= 2) points.push([c[0], c[1]]);
                }
            }
            if (points.length < 2) return;
            const lons = points.map((p) => p[0]);
            const lats = points.map((p) => p[1]);
            window.trendMap.fitToBounds([
                Math.min(...lons), Math.min(...lats), Math.max(...lons), Math.max(...lats),
            ]);
        }

        function escapeText(value) {
            const div = document.createElement('div');
            div.textContent = String(value);
            return div.innerHTML;
        }

        // Reads an NDJSON response body line by line, calling onMessage as each line arrives.
        async function readNdjson(body, onMessage) {
            const reader = body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            try {
                for (;;) {
                    const { value, done } = await reader.read();
                    buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
                    let nl;
                    while ((nl = buffer.indexOf('\n')) >= 0) {
                        const line = buffer.slice(0, nl).trim();
                        buffer = buffer.slice(nl + 1);
                        if (line) onMessage(JSON.parse(line));
                    }
                    if (done) break;
                }
                if (buffer.trim()) onMessage(JSON.parse(buffer));
            } catch (error) {
                reader.cancel().catch(() => {});
                throw error;
            }
        }

        let applyRun = null; // AbortController of the 'Apply' whose results are coming in

        async function triggerButton(buttonId) {
            if (applyRun) applyRun.abort();
            const run = new AbortController();
            applyRun = run;
            let shown = null; // result drawn so far, kept if a later part fails
            let pending = [];
            try {
                if (allTools.length === 0) {
                    await loadTools();
                }
                const intervalFloat = parseFloat(intervalValueInput.value.trim());
                if (!(Number.isFinite(intervalFloat) && intervalFloat > 0)) {
                    throw new Error('Interval length must be greater than 0.');
                }

                if (window.trendMap) {
                    window.trendMap.setLoading(true);
                }
                if (window.TrendPlots) window.TrendPlots.setLoading(true);
                if (window.TrendSimple) window.TrendSimple.setLoading(true);

                const payload = {
                    topics: selectedTopics,
                    tools: selectedTools,
                    timeintervall: [
                        timeintervallStartInput.value.trim(),
                        timeintervallEndInput.value.trim(),
                    ],
                    interval_length: [
                        intervalFloat,
                        intervalUnitSelect.value,
                    ],
                    area: window.getSelectedArea ? window.getSelectedArea() : null,
                };
                // The coverage lookup of empty cards must use what this request was made with.
                lastRequestContext = { area: payload.area, timeintervall: payload.timeintervall };

                // Streamed answer: each topic is drawn as soon as it is evaluated (app.py _stream_apply).
                const res = await fetch(`${API_BASE}/api/buttons/${encodeURIComponent(buttonId)}/stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: run.signal,
                });

                if (!res.ok || !res.body) {
                    const body = await res.json().catch(() => null);
                    throw new Error((body && body.error) || `The server answered with HTTP ${res.status}.`);
                }

                let ur = null;
                let finished = false;
                await readNdjson(res.body, (msg) => {
                    if (run !== applyRun) return;
                    if (msg.type === 'request') {
                        ur = msg.user_request;
                        pending = Array.isArray(msg.topics) ? msg.topics.slice() : [];
                    } else if (msg.type === 'partial' || msg.type === 'done') {
                        finished = msg.type === 'done';
                        pending = finished ? [] : pending.filter((t) => t !== msg.topic);
                        shown = msg.visualization;
                        renderVisualization(shown, { partial: !finished, pending });
                        if (window.TrendPlots) window.TrendPlots.setData(shown, ur);
                        if (window.TrendSimple) window.TrendSimple.setData(shown, ur);
                    } else if (msg.type === 'error') {
                        throw new Error(msg.error);
                    }
                });
                if (!finished && run === applyRun) {
                    throw new Error('The connection closed before all variables were loaded.');
                }
            } catch (error) {
                if (run !== applyRun) return; // replaced by a newer 'Apply'
                const container = document.getElementById('visualization-container');
                if (shown) {
                    // Keep what is already drawn; only the missing topics show the error.
                    renderVisualization(shown, { pending, failed: error.message || String(error) });
                } else if (container) {
                    const message = error && error.message ? error.message : String(error);
                    container.innerHTML = `<div class="empty-message">Error: the request failed: ${escapeText(message)}`
                        + `${/fetch|network/i.test(message) ? ' – is the Python server (python3 app.py) running?' : ''}</div>`;
                }
            } finally {
                if (run === applyRun) {
                    applyRun = null;
                    if (window.trendMap) {
                        window.trendMap.setLoading(false);
                    }
                    if (window.TrendPlots) window.TrendPlots.setLoading(false);
                    if (window.TrendSimple) window.TrendSimple.setLoading(false);
                    if (shown && buttonId === 'apply') revealResults();
                }
            }
        }

        // After 'Analyze': bring the results into view, so the user notices them below the map
        // and the box's station list. Waits until the panels have drawn (they render on the next
        // frames); does nothing when the results are already well in view.
        function revealResults() {
            requestAnimationFrame(() => requestAnimationFrame(() => {
                if (applyRun) return; // a newer 'Analyze' is running
                const card = ['.simple-card', '.plot-card', '.task-output']
                    .map((sel) => document.querySelector(`.main-content > ${sel}`))
                    .find((el) => el && el.getClientRects().length > 0);
                if (!card) return;
                const r = card.getBoundingClientRect();
                const vh = window.innerHeight || document.documentElement.clientHeight;
                if (r.top >= 0 && r.top < vh * 0.6) return;
                const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                card.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
            }));
        }

        document.querySelectorAll('button.py-button').forEach((buttonElement) => {
            buttonElement.addEventListener('click', () => {
                triggerButton(buttonElement.id);
            });
        });
    </script>
    <script src="/static/box-stations.js"></script>
    <script>
        // ---- Suggested case studies (GET /api/examples, examples.py) ----
        (function () {
            const COLORS = { heat: 'var(--cs-heat)', cold: 'var(--cs-cold)', rain: 'var(--cs-rain)', snow: 'var(--cs-snow)' };
            const LABELS = { heat: 'Heat', cold: 'Cold', rain: 'Precipitation', snow: 'Snow' };
            const ICONS = {
                heat: '<path d="M10 3a2 2 0 0 1 2 2v7.1a3.5 3.5 0 1 1-4 0V5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="15" r="1.6" fill="currentColor"/><path d="M15 4v4M13 6h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
                cold: '<path d="M10 3a2 2 0 0 1 2 2v7.1a3.5 3.5 0 1 1-4 0V5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="15" r="1.6" fill="currentColor"/><path d="M13.5 6h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
                rain: '<path d="M10 3c2.6 3.4 4.5 6 4.5 8.3a4.5 4.5 0 0 1-9 0C5.5 9 7.4 6.4 10 3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
                snow: '<path d="M10 2.5v15M3.5 6.25l13 7.5M3.5 13.75l13-7.5M8 4l2 1.6L12 4M8 16l2-1.6 2 1.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
            };
            // Which variable of the topic shows the event best (TMAX for heat, TMIN for cold, …).
            const PREFER = { heat: ['tmax', 'tavg', 'tmin'], cold: ['tmin', 'tavg', 'tmax'], rain: ['prcp'], snow: ['snwd', 'snow'] };
            const card = document.getElementById('examples-card');
            const list = document.getElementById('examples-list');
            if (!card || !list) return;
            const viewport = card.querySelector('.examples-viewport');

            // Arrows and edge fades only where there is more to scroll to.
            function updateScroll() {
                const max = list.scrollWidth - list.clientWidth;
                viewport.classList.toggle('can-left', list.scrollLeft > 4);
                viewport.classList.toggle('can-right', list.scrollLeft < max - 4);
            }
            list.addEventListener('scroll', updateScroll, { passive: true });
            window.addEventListener('resize', updateScroll);
            card.querySelector('.ex-prev').addEventListener('click', () => list.scrollBy({ left: -list.clientWidth * 0.8 }));
            card.querySelector('.ex-next').addEventListener('click', () => list.scrollBy({ left: list.clientWidth * 0.8 }));

            let examples = [];
            fetch(`${API_BASE}/api/examples`)
                .then((r) => (r.ok ? r.json() : { examples: [] }))
                .then((data) => {
                    examples = data.examples || [];
                    list.innerHTML = examples.map((ex, i) => {
                        const value = String(ex.value || ex.verified || '').split(' · ')[0];
                        const place = String(ex.place || '').split(',')[0];
                        return `<button type="button" class="ex-card" data-i="${i}" style="--ex-color:${COLORS[ex.category] || '#64748b'}"
                            title="${escapeText(`${ex.title} (${LABELS[ex.category] || ex.category})\n${ex.summary}\n${ex.variable || ''}: ${ex.value || ''} · ${ex.place}${ex.source ? ` · ${ex.source}` : ''}`)}">
                            <span class="ex-icon"><svg viewBox="0 0 20 20" aria-hidden="true">${ICONS[ex.category] || ICONS.heat}</svg></span>
                            <span class="ex-text">
                                <span class="ex-value">${escapeText(value)} <span class="ex-place">· ${escapeText(place)}</span></span>
                                <span class="ex-title">${escapeText(ex.title)}</span>
                            </span>
                        </button>`;
                    }).join('');
                    card.hidden = !examples.length;
                    requestAnimationFrame(updateScroll);
                })
                .catch(() => { card.hidden = true; });

            async function runExample(ex) {
                if (allTopics.length === 0) await loadTopics();
                for (const topic of Object.keys(selectedTopics)) selectedTopics[topic] = false;
                selectedTopics[ex.topic] = true;
                renderTopics(document.getElementById('topic-search').value);
                timeintervallStartInput.value = ex.start;
                timeintervallEndInput.value = ex.end;
                intervalValueInput.value = '1';
                intervalUnitSelect.value = 'Day';
                const area = {
                    type: 'Feature',
                    properties: { shape: 'point', placeName: ex.place },
                    geometry: { type: 'Point', coordinates: [ex.longitude, ex.latitude] },
                };
                if (window.trendMap && typeof window.trendMap.setArea === 'function') {
                    window.trendMap.setArea(area);
                    if (typeof window.trendMap.fitToBounds === 'function') {
                        window.trendMap.fitToBounds([ex.longitude - 0.3, ex.latitude - 0.2, ex.longitude + 0.3, ex.latitude + 0.2]);
                    }
                }
                refreshRegions();
                updateApplyButtonState();
                document.getElementById('plot-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
                await triggerButton('apply');
                if (window.TrendPlots) window.TrendPlots.focusExample(ex.focus, PREFER[ex.category]);
            }

            list.addEventListener('click', async (event) => {
                const button = event.target.closest('.ex-card');
                if (!button) return;
                const ex = examples[Number(button.dataset.i)];
                if (!ex) return;
                list.querySelectorAll('.ex-card').forEach((b) => { b.disabled = true; });
                button.classList.add('is-running');
                try {
                    await runExample(ex);
                } finally {
                    button.classList.remove('is-running');
                    list.querySelectorAll('.ex-card').forEach((b) => { b.disabled = false; });
                }
            });
        })();

        // ---- Satellite image of an event day (NASA GIBS, MODIS Terra true colour) ----
        (function () {
            const bar = document.getElementById('satellite-bar');
            const text = document.getElementById('satellite-text');
            let current = null;

            function shift(iso, days) {
                const t = new Date(`${iso}T12:00:00Z`);
                t.setUTCDate(t.getUTCDate() + days);
                return t.toISOString().slice(0, 10);
            }

            function show(iso) {
                if (!window.trendMap) return;
                current = iso;
                window.satelliteLayer = {
                    type: 'raster',
                    tiles: [`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/${iso}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`],
                    maxzoom: 9,
                    opacity: 0.95,
                    attribution: 'Imagery: NASA GIBS / MODIS Terra',
                };
                window.refreshMapLayers();
                const date = new Date(`${iso}T12:00:00Z`).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
                text.textContent = `Satellite image (MODIS Terra true colour), ${date}, ~10:30 local time`;
                bar.hidden = false;
                const area = window.getSelectedArea ? window.getSelectedArea() : null;
                const c = area && area.geometry && area.geometry.type === 'Point' ? area.geometry.coordinates : null;
                if (c && typeof window.trendMap.fitToBounds === 'function') {
                    window.trendMap.fitToBounds([c[0] - 4, c[1] - 3, c[0] + 4, c[1] + 3]);
                }
                document.querySelector('.map-box').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            function hide() {
                current = null;
                window.satelliteLayer = null;
                bar.hidden = true;
                window.refreshMapLayers();
            }

            document.addEventListener('trendplots:satellite', (event) => show(event.detail.date));
            document.getElementById('satellite-close').addEventListener('click', hide);
            bar.addEventListener('click', (event) => {
                const step = event.target.closest('[data-sat-step]');
                if (step && current) show(shift(current, Number(step.dataset.satStep)));
            });
        })();

        // ---- Legend for the result layers on the map ----
        window.updateMapLegend = function (layers) {
            const box = document.getElementById('map-legend');
            if (!box) return;
            const ids = (layers || []).map((l) => String(l.id || ''));
            const hasTrend = ids.some((id) => id === 'user-request-results' || id === 'area-result' || id.startsWith('area-stations-'));
            const hasStations = ids.includes('measuring-stations');
            if (!hasTrend && !hasStations) { box.hidden = true; return; }
            const row = (color, label) => `<div class="map-legend-row"><span class="map-legend-dot" style="background:${color}"></span>${label}</div>`;
            const open = box.dataset.collapsed !== '1';
            let html = `<details${open ? ' open' : ''}><summary class="map-legend-title">Trend colours</summary>`;
            if (hasTrend) {
                html += row('#dc2626', 'rising (significant)') + row('#fca5a5', 'rising (not significant)')
                    + row('#93c5fd', 'falling (not significant)') + row('#2563eb', 'falling (significant)') + row('#94a3b8', 'no trend / not computed');
            }
            if (hasStations) html += row('#7c3aed', 'measuring station used');
            if (ids.some((id) => id.startsWith('area-stations-'))) html += '<div class="map-legend-row" style="color:#64748b">area: each dot is one station, coloured by its own trend</div>';
            box.innerHTML = `${html}</details>`;
            box.querySelector('details').addEventListener('toggle', (e) => { box.dataset.collapsed = e.target.open ? '0' : '1'; });
            box.hidden = false;
        };
        // A point selection folds the legend away, so the station used (hover it) stays visible.
        window.addEventListener('trend:area', () => {
            const area = window.getSelectedArea ? window.getSelectedArea() : null;
            if (!area || !area.geometry || area.geometry.type !== 'Point') return;
            const box = document.getElementById('map-legend');
            if (!box) return;
            box.dataset.collapsed = '1';
            const details = box.querySelector('details');
            if (details) details.open = false;
        });
    </script>
